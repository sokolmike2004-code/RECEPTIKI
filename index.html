<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Книга Рецептов 🍳 Premium</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f7f6; --card: #ffffff; --text: #1a1a1a; --muted: #666;
    --primary: #ff6b6b; --primary-hover: #ff5252; --primary-light: #ffe3e3;
    --secondary: #4ecdc4; --border: #e0e0e0; --shadow: 0 8px 30px rgba(0,0,0,0.06);
    --glass: rgba(255, 255, 255, 0.85); --badge-bg: #fff3cd; --badge-text: #856404;
  }
  
  [data-theme="dark"] {
    --bg: #121212; --card: #1e1e1e; --text: #f5f5f5; --muted: #a0a0a0;
    --primary: #ff6b6b; --primary-hover: #ff5252; --primary-light: #3a1c1c;
    --secondary: #4ecdc4; --border: #333333; --shadow: 0 8px 30px rgba(0,0,0,0.3);
    --glass: rgba(30, 30, 30, 0.85); --badge-bg: #332701; --badge-text: #ffda6a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
  
  body {
    background-color: var(--bg); color: var(--text); line-height: 1.6;
    transition: background-color 0.4s, color 0.4s;
    padding-bottom: 80px;
  }

  /* ---------- HEADER (Стеклянный эффект) ---------- */
  header {
    position: sticky; top: 0; z-index: 50;
    background: var(--glass); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    padding: 15px 20px; display: flex; justify-content: space-between; align-items: center;
    box-shadow: 0 4px 20px rgba(0,0,0,0.05); border-bottom: 1px solid var(--border);
  }
  .logo { font-size: 24px; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 8px; }
  
  .header-controls { display: flex; gap: 12px; align-items: center; }
  .icon-btn {
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-size: 18px;
    display: flex; justify-content: center; align-items: center; transition: all 0.2s;
  }
  .icon-btn:hover { transform: scale(1.1); border-color: var(--primary); color: var(--primary); }
  .admin-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

  /* ---------- TOOLBAR ---------- */
  .toolbar { max-width: 1200px; margin: 30px auto; padding: 0 20px; display: flex; flex-direction: column; gap: 20px; }
  .search-row { display: flex; gap: 15px; flex-wrap: wrap; }
  .search-box { flex: 1; min-width: 250px; position: relative; }
  .search-box input {
    width: 100%; padding: 16px 20px 16px 50px; border: 2px solid transparent;
    border-radius: 16px; font-size: 15px; font-weight: 500;
    background: var(--card); color: var(--text); box-shadow: var(--shadow);
    transition: all 0.3s;
  }
  .search-box input:focus { border-color: var(--primary); outline: none; transform: translateY(-2px); }
  .search-box::before { content: "🔍"; position: absolute; left: 18px; top: 50%; transform: translateY(-50%); font-size: 18px; }
  .search-box.fridge::before { content: "🥦"; }
  
  .filters-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; }
  .filter-btn {
    padding: 8px 16px; border: 1px solid var(--border); background: var(--card); color: var(--text);
    border-radius: 20px; cursor: pointer; font-size: 13px; font-weight: 600; transition: all 0.2s;
  }
  .filter-btn:hover { border-color: var(--primary); color: var(--primary); }
  .filter-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
  
  .sort-select {
    padding: 10px 15px; border-radius: 12px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); font-weight: 600; cursor: pointer; outline: none;
  }

  /* ---------- GRID & CARDS ---------- */
  .grid { max-width: 1200px; margin: 0 auto 60px; padding: 0 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px; }
  .card {
    background: var(--card); border-radius: 24px; overflow: hidden; box-shadow: var(--shadow);
    cursor: pointer; transition: all 0.3s ease; display: flex; flex-direction: column; border: 1px solid var(--border);
  }
  .card:hover { transform: translateY(-8px); box-shadow: 0 15px 35px rgba(0,0,0,0.15); }
  .card-image { height: 220px; position: relative; overflow: hidden; }
  .card-image img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s; }
  .card:hover .card-image img { transform: scale(1.1); }
  .fav-btn {
    position: absolute; top: 15px; right: 15px; width: 40px; height: 40px;
    border-radius: 50%; border: none; background: rgba(255,255,255,0.9); cursor: pointer;
    font-size: 20px; display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(5px); transition: transform 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  }
  .fav-btn:hover { transform: scale(1.15); }
  .fav-btn.active { background: #ffe3e3; }
  
  .card-body { padding: 20px; display: flex; flex-direction: column; gap: 12px; flex: 1; }
  .badge-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .badge {
    padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.5px; background: var(--badge-bg); color: var(--badge-text);
  }
  .badge.cal { background: #ffe3e3; color: #d63031; }
  .badge.time { background: #e3f2fd; color: #0984e3; }
  
  .card-title { font-size: 20px; font-weight: 800; line-height: 1.3; }
  .card-desc { font-size: 14px; color: var(--muted); flex: 1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  
  .macros-row { display: flex; gap: 10px; font-size: 12px; font-weight: 600; color: var(--muted); border-top: 1px dashed var(--border); padding-top: 12px; }
  .macros-row span { flex: 1; text-align: center; }

  /* ---------- MODALS ---------- */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none;
    align-items: center; justify-content: center; padding: 20px; z-index: 100; backdrop-filter: blur(5px);
  }
  .modal-overlay.open { display: flex; animation: fadeIn 0.3s; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  
  .modal {
    background: var(--card); border-radius: 30px; max-width: 800px; width: 100%;
    max-height: 90vh; overflow-y: auto; position: relative; animation: slideUp 0.4s; border: 1px solid var(--border);
  }
  .modal-hero { height: 300px; position: relative; }
  .modal-hero img { width: 100%; height: 100%; object-fit: cover; }
  .modal-close {
    position: absolute; top: 20px; right: 20px; width: 44px; height: 44px;
    border-radius: 50%; border: none; background: rgba(255,255,255,0.9); cursor: pointer;
    font-size: 24px; display: flex; align-items: center; justify-content: center; z-index: 2; transition: transform 0.2s;
  }
  .modal-close:hover { transform: rotate(90deg); }
  .modal-fav {
    position: absolute; top: 20px; left: 20px; width: 50px; height: 50px;
    border-radius: 50%; border: none; background: rgba(255,255,255,0.9); cursor: pointer;
    font-size: 26px; display: flex; align-items: center; justify-content: center; z-index: 2;
  }
  
  .modal-header { padding: 30px 40px 10px; }
  .modal-header h2 { font-size: 32px; font-weight: 800; margin-bottom: 10px; }
  .modal-header p { font-size: 16px; color: var(--muted); }
  
  .modal-body { padding: 20px 40px 40px; }
  
  .upload-row { margin-bottom: 25px; display: flex; gap: 15px; flex-wrap: wrap; }
  .btn-primary {
    padding: 12px 24px; background: var(--primary); color: white; border: none;
    border-radius: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s; font-size: 14px;
  }
  .btn-primary:hover { background: var(--primary-hover); transform: translateY(-2px); }
  .btn-secondary {
    padding: 12px 24px; background: var(--card); color: var(--text); border: 1px solid var(--border);
    border-radius: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s; font-size: 14px;
  }
  .btn-secondary:hover { border-color: var(--primary); color: var(--primary); }
  
  .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 30px; }
  .stat-box { background: var(--bg); padding: 15px; border-radius: 16px; text-align: center; }
  .stat-label { font-size: 12px; color: var(--muted); text-transform: uppercase; font-weight: 600; margin-bottom: 5px; }
  .stat-value { font-size: 18px; font-weight: 800; color: var(--primary); }
  
  .modal-body h3 { font-size: 20px; font-weight: 800; margin: 30px 0 15px; display: flex; align-items: center; gap: 10px; }
  
  /* Ингредиенты */
  .ingr-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
  .ingr-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 16px; background: var(--bg); border-radius: 12px; font-size: 15px; font-weight: 500;
  }
  .add-to-cart {
    background: var(--primary-light); color: var(--primary); border: none;
    width: 32px; height: 32px; border-radius: 8px; cursor: pointer; font-weight: 800; font-size: 18px;
    display: flex; align-items: center; justify-content: center; transition: all 0.2s;
  }
  .add-to-cart:hover { background: var(--primary); color: white; }
  
  /* Шаги */
  .steps-list { counter-reset: step-counter; list-style: none; display: flex; flex-direction: column; gap: 15px; }
  .step-item {
    position: relative; padding: 15px 20px 15px 60px; background: var(--bg); border-radius: 16px; font-size: 15px;
  }
  .step-item::before {
    counter-increment: step-counter; content: counter(step-counter);
    position: absolute; left: 15px; top: 50%; transform: translateY(-50%);
    width: 30px; height: 30px; background: var(--primary); color: white;
    border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800;
  }

  /* ---------- SHOPPING LIST FAB ---------- */
  .fab {
    position: fixed; bottom: 30px; right: 30px; width: 65px; height: 65px;
    background: var(--primary); color: white; border-radius: 50%; border: none;
    font-size: 28px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; box-shadow: 0 8px 25px rgba(255, 107, 107, 0.4); z-index: 90;
    transition: transform 0.3s;
  }
  .fab:hover { transform: scale(1.1); }
  .fab-badge {
    position: absolute; top: -5px; right: -5px; background: #2d3436; color: white;
    font-size: 14px; font-weight: 800; width: 24px; height: 24px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; border: 2px solid var(--bg);
  }

  /* ---------- TOASTS ---------- */
  #toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
  .toast {
    background: var(--card); color: var(--text); padding: 15px 25px; border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15); font-weight: 600; display: flex; align-items: center; gap: 12px;
    animation: slideDown 0.3s ease-out; border-left: 5px solid var(--secondary);
  }
  .toast.error { border-left-color: #ff4757; }
  @keyframes slideDown { from { transform: translate(-50%, -20px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }

  /* ---------- COOKING MODE ---------- */
  #cooking-mode {
    position: fixed; inset: 0; background: var(--bg); z-index: 200;
    display: none; flex-direction: column; justify-content: center; align-items: center; padding: 20px;
  }
  .cook-step-box { max-width: 800px; text-align: center; animation: slideUp 0.5s; }
  .cook-step-text { font-size: 28px; font-weight: 700; margin: 30px 0; line-height: 1.4; }
  .cook-nav { display: flex; gap: 20px; margin-top: 40px; }
  .cook-progress { font-size: 18px; font-weight: 800; color: var(--primary); background: var(--primary-light); padding: 8px 20px; border-radius: 20px; }

  /* Адаптив */
  @media (max-width: 600px) {
    .modal-header { padding: 20px; }
    .modal-body { padding: 15px 20px; }
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
    .search-row { flex-direction: column; }
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div id="toast-container"></div>

<header>
  <div class="logo">🍳 RecipeBook</div>
  <div class="header-controls">
    <button class="icon-btn" id="themeToggle" onclick="toggleTheme()" title="Переключить тему">🌙</button>
    <button class="icon-btn admin-btn" id="adminBtn" onclick="toggleAdminMode()" title="Режим администратора">🔒</button>
  </div>
</header>

<div class="toolbar">
  <div class="search-row">
    <div class="search-box"><input type="text" id="searchInput" placeholder="Поиск по названию..."></div>
    <div class="search-box fridge"><input type="text" id="ingredientInput" placeholder="Что в холодильнике? (например: курица, сыр)"></div>
  </div>
  <div class="filters-row">
    <div class="filters" id="filters"></div>
    <select class="sort-select" id="sortSelect" onchange="renderGrid()">
      <option value="default">Сортировка: По умолчанию</option>
      <option value="time">Сначала быстрые ⏱</option>
      <option value="calories">Сначала низкокалорийные 🔥</option>
      <option value="title">По алфавиту 🔤</option>
    </select>
  </div>
</div>

<div class="grid" id="grid"></div>

<!-- Плавающая кнопка списка покупок -->
<button class="fab" onclick="openShoppingList()">
  🛒 <span class="fab-badge" id="shopBadge" style="display:none;">0</span>
</button>

<!-- Модальное окно рецепта -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-hero">
      <img id="mImg" src="" alt="">
      <button class="modal-fav" id="mFavBtn" onclick="toggleFavFromModal()">🤍</button>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-header">
      <h2 id="mTitle"></h2>
      <p id="mDesc"></p>
    </div>
    <div class="modal-body">
      <div class="upload-row" id="uploadRow" style="display: none;">
        <button class="btn-primary" onclick="document.getElementById('fileInput').click()">📷 Загрузить фото</button>
        <button class="btn-secondary" id="resetImgBtn" onclick="resetImage()" style="display:none;">🔄 Сбросить</button>
        <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleImageUpload(event)">
      </div>
      
      <div class="stats-grid">
        <div class="stat-box"><div class="stat-label">Время</div><div class="stat-value" id="mTime"></div></div>
        <div class="stat-box"><div class="stat-label">Вес</div><div class="stat-value" id="mWeight"></div></div>
        <div class="stat-box"><div class="stat-label">Ккал/100г</div><div class="stat-value" id="mCal"></div></div>
        <div class="stat-box"><div class="stat-label">Сложность</div><div class="stat-value" id="mDiff"></div></div>
      </div>

      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3>🧾 Ингредиенты</h3>
        <button class="btn-secondary" onclick="startCooking()">👨‍🍳 Начать готовку</button>
      </div>
      <ul class="ingr-list" id="mIngr"></ul>

      <h3>📖 Приготовление</h3>
      <ol class="steps-list" id="mSteps"></ol>
    </div>
  </div>
</div>

<!-- Модальное окно списка покупок -->
<div class="modal-overlay" id="shopModal">
  <div class="modal" style="max-width: 500px;">
    <div class="modal-header" style="display:flex; justify-content:space-between; align-items:center;">
      <h2>🛒 Список покупок</h2>
      <button class="modal-close" style="position:static;" onclick="document.getElementById('shopModal').classList.remove('open')">✕</button>
    </div>
    <div class="modal-body">
      <ul class="ingr-list" id="shopList"></ul>
      <button class="btn-secondary" style="width:100%; margin-top:20px;" onclick="clearShoppingList()">Очистить список</button>
    </div>
  </div>
</div>

<!-- Режим готовки -->
<div id="cooking-mode">
  <div class="cook-step-box">
    <h2 id="cookTitle" style="color:var(--primary);">Название блюда</h2>
    <div class="cook-progress" id="cookProgress">Шаг 1 из 5</div>
    <div class="cook-step-text" id="cookText">Текст шага...</div>
    <div class="cook-nav">
      <button class="btn-secondary" onclick="prevStep()">← Назад</button>
      <button class="btn-primary" onclick="nextStep()">Далее →</button>
    </div>
    <button class="btn-secondary" style="margin-top:30px;" onclick="closeCooking()">Выйти</button>
  </div>
</div>

<script>
/* =====================================================
   ВАШИ КЛЮЧИ SUPABASE
   ===================================================== */
const SUPABASE_URL = "https://ooweerxaqizvovadsecb.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_8SvPI97piMkxAmoZ8vUbIQ_U7YoGp4w";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let customImages = {};
let currentModalId = null;

async function loadImagesFromCloud() {
  const { data, error } = await supabaseClient.from('custom_images').select('*');
  if (error) return console.error(error);
  customImages = {};
  if (data) data.forEach(item => { customImages[item.recipe_id] = item.image_url; });
  renderGrid();
}
loadImagesFromCloud();

/* ---------- БАЗА РЕЦЕПТОВ (с БЖУ) ---------- */
// Добавлены поля protein, fat, carbs для красоты
const recipes = [
  { id: 1, title: "Паста Карбонара", img: "https://images.unsplash.com/photo-1612874742237-6526221588e3?w=800&q=80", desc: "Классическая итальянская паста с беконом и яйцом", category: "Основное", time: "25 мин", servings: "2", difficulty: "Средне", calories: 380, weight: "450 г", protein: 18, fat: 22, carbs: 45, ingredients: ["Спагетти — 200 г","Бекон — 150 г","Яйца — 2 шт","Пармезан — 50 г","Чеснок — 1 зубчик","Соль, перец"], steps: ["Отварите спагетти в подсоленной воде до готовности.","Обжарьте бекон на сковороде до хруста.","Взбейте яйца с тёртым пармезаном.","Смешайте горячую пасту с беконом, снимите с огня.","Добавьте яичную смесь, быстро перемешайте.","Подавайте, посыпав пармезаном и перцем."] },
  { id: 2, title: "Греческий салат", img: "img/greek.jpg", desc: "Свежий салат с фетой, огурцом и маслинами", category: "Салаты", time: "15 мин", servings: "3", difficulty: "Легко", calories: 120, weight: "600 г", protein: 5, fat: 9, carbs: 6, ingredients: ["Помидоры — 3 шт","Огурцы — 2 шт","Фета — 150 г","Маслины — 100 г","Красный лук — 1/2","Оливковое масло","Орегано"], steps: ["Нарежьте помидоры крупными кусками.","Нарежьте огурцы полукружьями.","Лук нарежьте тонкими полукольцами.","Смешайте овощи, добавьте маслины.","Сверху выложите кубики феты.","Заправьте маслом, посыпьте орегано."] },
  { id: 3, title: "Борщ", img: "img/borsh.jpg", desc: "Насыщенный украинский суп со свёклой и мясом", category: "Супы", time: "90 мин", servings: "6", difficulty: "Средне", calories: 85, weight: "2.5 кг", protein: 6, fat: 4, carbs: 8, ingredients: ["Говядина — 500 г","Свёкла — 2 шт","Капуста — 300 г","Картофель — 3 шт","Морковь — 1","Лук — 1","Томатная паста — 2 ст.л."], steps: ["Сварите бульон из мяса.","Добавьте нарезанный картофель.","Обжарьте лук, морковь и свёклу.","Добавьте зажарку в бульон.","Положите капусту, варите 10 мин.","Дайте настояться."] },
  { id: 4, title: "Сырники", img: "img/syrniki.jpg", desc: "Нежные творожные сырники на завтрак", category: "Завтрак", time: "25 мин", servings: "3", difficulty: "Легко", calories: 210, weight: "500 г", protein: 16, fat: 8, carbs: 22, ingredients: ["Творог — 400 г","Яйцо — 1 шт","Мука — 3 ст.л.","Сахар — 2 ст.л."], steps: ["Разомните творог вилкой.","Добавьте яйцо, сахар и ванилин.","Всыпьте муку, замесите массу.","Сформируйте сырники.","Обжарьте на среднем огне."] },
  { id: 5, title: "Овсяная каша", img: "img/ovsyanka.jpg", desc: "Полезный завтрак с ягодами и мёдом", category: "Завтрак", time: "10 мин", servings: "1", difficulty: "Легко", calories: 150, weight: "300 г", protein: 6, fat: 4, carbs: 24, ingredients: ["Овсяные хлопья — 60 г","Молоко — 250 мл","Мёд — 1 ст.л.","Ягоды"], steps: ["Залейте хлопья молоком.","Доведите до кипения.","Варите 5–7 минут.","Подавайте с мёдом и ягодами."] },
  { id: 6, title: "Грибной крем-суп", img: "https://images.pexels.com/photos/2548840/pexels-photo-2548840.jpeg?w=800", desc: "Бархатистый суп из шампиньонов со сливками", category: "Супы", time: "40 мин", servings: "4", difficulty: "Средне", calories: 140, weight: "1.4 кг", protein: 5, fat: 11, carbs: 7, ingredients: ["Шампиньоны","Лук","Сливки","Картофель"], steps: ["Обжарьте лук и грибы.","Добавьте картофель, варите.","Пробейте блендером.","Влейте сливки."] },
  { id: 7, title: "Пицца", img: "https://images.unsplash.com/photo-1574071318508-1cdbab80d002?w=800", desc: "Домашняя пицца", category: "Основное", time: "60 мин", servings: "2", difficulty: "Средне", calories: 270, weight: "600 г", protein: 12, fat: 10, carbs: 35, ingredients: ["Мука","Моцарелла","Соус"], steps: ["Замесите тесто.","Раскатайте.","Выпекайте."] },
  { id: 8, title: "Сырный суп", img: "https://images.pexels.com/photos/37593663/pexels-photo-37593663.jpeg?w=800", desc: "Крем-суп с сыром", category: "Супы", time: "35 мин", servings: "4", difficulty: "Легко", calories: 130, weight: "1.5 кг", protein: 8, fat: 9, carbs: 5, ingredients: ["Бульон","Сыр","Картофель"], steps: ["Сварите.","Добавьте сыр."] },
  { id: 9, title: "Пюре", img: "https://images.unsplash.com/photo-1600628421066-f6bda6a7b976?w=800", desc: "Картофельное пюре", category: "Основное", time: "30 мин", servings: "4", difficulty: "Легко", calories: 130, weight: "600 г", protein: 3, fat: 6, carbs: 18, ingredients: ["Картофель","Молоко","Масло"], steps: ["Сварите.","Разомните."] },
  { id: 10, title: "Оливье", img: "https://images.pexels.com/photos/35572936/pexels-photo-35572936.jpeg?w=800", desc: "Праздничный салат", category: "Салаты", time: "40 мин", servings: "6", difficulty: "Легко", calories: 190, weight: "1.3 кг", protein: 6, fat: 15, carbs: 10, ingredients: ["Картофель","Колбаса","Горошек"], steps: ["Отварите.","Нарежьте.","Смешайте."] }
  { id: 11, title: "Грибной крем-суп", img: "https://images.pexels.com/photos/2548840/pexels-photo-2548840.jpeg?w=800&q=80&auto=format&fit=crop", desc: "Бархатистый суп из шампиньонов со сливками", category: "Супы", time: "40 мин", servings: "4", difficulty: "Средне", calories: 140, weight: "1.4 кг", protein: 5, fat: 11, carbs: 7, ingredients: ["Шампиньоны — 400 г","Лук — 1 шт","Сливки — 200 мл","Картофель — 2 шт","Масло — 30 г","Соль, перец","Зелень"], steps: ["Обжарьте лук на масле до прозрачности.","Добавьте нарезанные грибы, жарьте 10 мин.","Добавьте картофель и воду, варите 15 мин.","Пробейте суп блендером до однородности.","Влейте сливки, прогрейте.","Подавайте с зеленью и сухариками."] },
  { id: 12, title: "Тирамису", img: "https://images.unsplash.com/photo-1571877227200-a0d98ea607e9?w=800&q=80&auto=format&fit=crop", desc: "Итальянский десерт с маскарпоне и кофе", category: "Десерт", time: "30 мин + охлаждение", servings: "6", difficulty: "Средне", calories: 320, weight: "900 г", protein: 6, fat: 20, carbs: 30, ingredients: ["Маскарпоне — 500 г","Савоярди — 200 г","Яйца — 4 шт","Сахар — 100 г","Кофе — 200 мл","Какао — 2 ст.л."], steps: ["Сварите крепкий кофе, остудите.","Взбейте яйца с сахаром.","Добавьте маскарпоне, перемешайте.","Обмакните савоярди в кофе, выложите слоем.","Чередуйте слои печенья и крема.","Посыпьте какао, охладите 4 часа."] },
  { id: 13, title: "Сырники", img: "img/syrniki.jpg", desc: "Нежные творожные сырники на завтрак", category: "Завтрак", time: "25 мин", servings: "3", difficulty: "Легко", calories: 210, weight: "500 г", protein: 16, fat: 8, carbs: 22, ingredients: ["Творог — 400 г","Яйцо — 1 шт","Мука — 3 ст.л.","Сахар — 2 ст.л.","Ванилин — щепотка","Растительное масло"], steps: ["Разомните творог вилкой.","Добавьте яйцо, сахар и ванилин.","Всыпьте муку, замесите массу.","Сформируйте сырники, обваляйте в муке.","Обжарьте на среднем огне с двух сторон.","Подавайте со сметаной или вареньем."] },
  { id: 14, title: "Оливье", img: "https://images.pexels.com/photos/35572936/pexels-photo-35572936.jpeg?w=800&q=80&auto=format&fit=crop", desc: "Классический праздничный салат", category: "Салаты", time: "40 мин", servings: "6", difficulty: "Легко", calories: 190, weight: "1.3 кг", protein: 6, fat: 15, carbs: 10, ingredients: ["Картофель — 4 шт","Морковь — 2 шт","Яйца — 4 шт","Колбаса — 300 г","Огурцы солёные — 3 шт","Горошек — 1 банка","Майонез"], steps: ["Отварите картофель, морковь и яйца.","Остудите и нарежьте кубиками.","Нарежьте колбасу и огурцы.","Добавьте горошек.","Заправьте майонезом.","Посолите и перемешайте."] },
  { id: 15, title: "Плов", img: "https://images.pexels.com/photos/14286683/pexels-photo-14286683.jpeg?w=800&q=80&auto=format&fit=crop", desc: "Узбекский плов с бараниной и морковью", category: "Основное", time: "1.5 ч", servings: "6", difficulty: "Сложно", calories: 300, weight: "2 кг", protein: 12, fat: 10, carbs: 35, ingredients: ["Рис — 500 г","Баранина — 600 г","Морковь — 4 шт","Лук — 2 шт","Чеснок — 1 головка","Растительное масло","Зира, барбарис, соль"], steps: ["Обжарьте мясо до корочки в казане.","Добавьте лук, жарьте до золотистого.","Добавьте морковь соломкой.","Влейте воду, тушите 20 мин.","Выложите рис, добавьте специи и чеснок.","Варите под крышкой 20 мин, дайте постоять."] },
  { id: 16, title: "Стейк из говядины", img: "https://images.unsplash.com/photo-1546964124-0cce460f38ef?w=800&q=80&auto=format&fit=crop", desc: "Сочный стейк рибай с розмарином", category: "Основное", time: "20 мин", servings: "1", difficulty: "Средне", calories: 350, weight: "300 г", protein: 25, fat: 22, carbs: 0, ingredients: ["Стейк рибай — 300 г","Сливочное масло — 30 г","Чеснок — 2 зубчика","Розмарин","Соль, перец","Оливковое масло"], steps: ["Достаньте стейк за 30 мин до готовки.","Посолите и поперчите с двух сторон.","Разогрейте сковороду до максимума.","Обжарьте по 2–3 мин с каждой стороны.","Добавьте масло, чеснок, розмарин, полейте стейк.","Дайте отдохнуть 5 мин перед подачей."] },
  { id: 17, title: "Брускетта", img: "https://images.unsplash.com/photo-1572695157366-5e585ab2b69f?w=800&q=80&auto=format&fit=crop", desc: "Итальянская закуска с томатами на тостах", category: "Закуски", time: "15 мин", servings: "4", difficulty: "Легко", calories: 160, weight: "350 г", protein: 5, fat: 6, carbs: 20, ingredients: ["Багет — 1 шт","Помидоры — 4 шт","Чеснок — 2 зубчика","Базилик","Оливковое масло","Соль, перец"], steps: ["Нарежьте багет ломтиками.","Подсушите в духовке или на гриле.","Натрите тосты чесноком.","Нарежьте помидоры кубиками.","Смешайте с базиликом, маслом, солью.","Выложите томаты на тосты."] },
  { id: 18, title: "Ризотто с грибами", img: "https://images.unsplash.com/photo-1476124369491-e7addf5db371?w=800&q=80&auto=format&fit=crop", desc: "Кремовое итальянское ризотто с шампиньонами", category: "Основное", time: "35 мин", servings: "3", difficulty: "Средне", calories: 250, weight: "900 г", protein: 8, fat: 9, carbs: 28, ingredients: ["Рис арборио — 300 г","Шампиньоны — 300 г","Лук — 1 шт","Бульон — 1 л","Пармезан — 50 г","Белое вино — 100 мл","Масло"], steps: ["Обжарьте лук и грибы на масле.","Добавьте рис, обжарьте 1 мин.","Влейте вино, дайте испариться.","Постепенно добавляйте горячий бульон, помешивая.","Готовьте 18–20 мин до кремовой текстуры.","Добавьте пармезан и масло, перемешайте."] },
  { id: 19, title: "Шоколадный брауни", img: "https://images.unsplash.com/photo-1606313564200-e75d5e30476c?w=800&q=80&auto=format&fit=crop", desc: "Влажный шоколадный брауни с орехами", category: "Десерт", time: "45 мин", servings: "8", difficulty: "Легко", calories: 400, weight: "800 г", protein: 5, fat: 22, carbs: 40, ingredients: ["Тёмный шоколад — 200 г","Масло — 150 г","Яйца — 3 шт","Сахар — 200 г","Мука — 100 г","Грецкие орехи — 100 г","Какао — 2 ст.л."], steps: ["Растопите шоколад с маслом.","Взбейте яйца с сахаром.","Смешайте шоколадную массу с яйцами.","Добавьте муку и какао.","Вмешайте орехи, вылейте в форму.","Выпекайте 25 мин при 180°C."] },
  { id: 20, title: "Лимонад домашний", img: "https://images.unsplash.com/photo-1621263764928-df1444c5e859?w=800&q=80&auto=format&fit=crop", desc: "Освежающий лимонад с мятой и лимоном", category: "Напитки", time: "10 мин", servings: "4", difficulty: "Легко", calories: 45, weight: "1.2 л", protein: 0, fat: 0, carbs: 11, ingredients: ["Лимоны — 3 шт","Сахар — 100 г","Вода — 1 л","Мята — пучок","Лёд — по вкусу"], steps: ["Вскипятите воду с сахаром, остудите.","Выжмите сок из лимонов.","Смешайте сок с сиропом.","Добавьте мяту и лёд.","Дайте настояться 10 мин.","Подавайте охлаждённым."] },
  { id: 21, title: "Окрошка", img: "https://images.pexels.com/photos/5638247/pexels-photo-5638247.jpeg?w=800&q=80&auto=format&fit=crop", desc: "Освежающий летний холодный суп на квасе", category: "Супы", time: "30 мин", servings: "4", difficulty: "Легко", calories: 60, weight: "1.5 кг", protein: 4, fat: 3, carbs: 5, ingredients: ["Квас — 1 л","Картофель — 3 шт","Яйца — 3 шт","Колбаса — 200 г","Огурцы — 2 шт","Редис — 5 шт","Зелень","Сметана"], steps: ["Отварите картофель и яйца, остудите.","Нарежьте картофель, яйца, колбасу и овощи мелкими кубиками.","Смешайте все ингредиенты в кастрюле.","Добавьте мелко нарезанную зелень и соль.","Залейте квасом и добавьте ложку сметаны перед подачей."] },
  { id: 22, title: "Бефстроганов", img: "https://images.unsplash.com/photo-1534080564583-6be75777b70a?w=800&q=80&auto=format&fit=crop", desc: "Нежная говядина в сливочно-грибном соусе", category: "Основное", time: "40 мин", servings: "4", difficulty: "Средне", calories: 220, weight: "800 г", protein: 18, fat: 14, carbs: 6, ingredients: ["Говядина — 500 г","Шампиньоны — 200 г","Лук — 1 шт","Сливки — 200 мл","Мука — 1 ст.л.","Соль, перец","Масло"], steps: ["Нарежьте мясо тонкими брусочками, обжарьте на масле до румяной корочки.","Добавьте лук и грибы, жарьте 10 минут.","Посыпьте мукой, перемешайте.","Влейте сливки, посолите и поперчите.","Тушите 10-15 минут на медленном огне до загустения."] },
  { id: 23, title: "Капрезе", img: "https://images.unsplash.com/photo-1592417817098-8fd3d9eb14a5?w=800&q=80&auto=format&fit=crop", desc: "Итальянская закуска из томатов, моцареллы и базилика", category: "Закуски", time: "10 мин", servings: "2", difficulty: "Легко", calories: 180, weight: "300 г", protein: 10, fat: 12, carbs: 4, ingredients: ["Помидоры — 3 шт","Моцарелла — 200 г","Базилик — пучок","Оливковое масло","Бальзамический соус","Соль, перец"], steps: ["Нарежьте помидоры и моцареллу кружочками одинаковой толщины.","Выложите на тарелку, чередуя томат и сыр.","Добавьте листья базилика.","Полейте оливковым маслом и бальзамическим соусом.","Посолите и поперчите по вкусу."] },
  { id: 24, title: "Картофельное пюре", img: "https://images.unsplash.com/photo-1600628421066-f6bda6a7b976?w=800&q=80&auto=format&fit=crop", desc: "Идеальный гарнир — нежное и сливочное пюре", category: "Основное", time: "30 мин", servings: "4", difficulty: "Легко", calories: 130, weight: "600 г", protein: 3, fat: 6, carbs: 18, ingredients: ["Картофель — 700 г","Молоко — 150 мл","Сливочное масло — 50 г","Соль, перец","Зелень"], steps: ["Очистите картофель и отварите до мягкости в подсоленной воде.","Слейте воду, добавьте сливочное масло.","Разомните картофель толкушкой.","Влейте горячее молоко, продолжая помешивать.","Взбейте до однородности, добавьте зелень."] },
  { id: 25, title: "Куриный бульон", img: "https://images.pexels.com/photos/539451/pexels-photo-539451.jpeg?w=800&q=80&auto=format&fit=crop", desc: "Прозрачный, наваристый бульон для восстановления сил", category: "Супы", time: "1.5 ч", servings: "4", difficulty: "Легко", calories: 50, weight: "2 л", protein: 3, fat: 2, carbs: 0, ingredients: ["Куриная тушка — 1 шт","Морковь — 1 шт","Лук — 1 шт","Лавровый лист","Перец горошком","Соль","Вода — 2.5 л"], steps: ["Промойте курицу, залейте холодной водой и доведите до кипения.","Снимите пену, убавьте огонь.","Добавьте целую морковь, луковицу и специи.","Варите на медленном огне 1-1.5 часа.","Процедите бульон, мясо можно использовать отдельно."] },
  { id: 26, title: "Гречка с грибами", img: "https://images.unsplash.com/photo-1543339308-43e59d6b73a6?w=800&q=80&auto=format&fit=crop", desc: "Сытное и полезное блюдо на каждый день", category: "Основное", time: "30 мин", servings: "3", difficulty: "Легко", calories: 160, weight: "700 г", protein: 6, fat: 5, carbs: 25, ingredients: ["Гречка — 200 г","Шампиньоны — 300 г","Лук — 1 шт","Масло — 30 г","Соль, перец","Вода — 400 мл"], steps: ["Промойте гречку, залейте водой и варите до готовности.","Нарежьте лук и грибы.","Обжарьте лук на масле до золотистого цвета, добавьте грибы.","Жарьте грибы до испарения жидкости.","Смешайте готовую гречку с грибами, посолите и поперчите."] },
  { id: 27, title: "Чесночные гренки", img: "https://images.unsplash.com/photo-1573140247632-f8fd74997d5c?w=800&q=80&auto=format&fit=crop", desc: "Хрустящая закуска к супу или пиву", category: "Закуски", time: "15 мин", servings: "2", difficulty: "Легко", calories: 350, weight: "200 г", protein: 7, fat: 12, carbs: 45, ingredients: ["Белый хлеб — 4 ломтика","Чеснок — 3 зубчика","Оливковое масло — 3 ст.л.","Соль","Зелень"], steps: ["Нарежьте хлеб брусочками.","Смешайте масло с выдавленным чесноком и солью.","Обмакните каждый кусочек хлеба в масло.","Выложите на противень и запекайте при 180°C 10 минут до хруста.","Посыпьте зеленью."] },
  { id: 28, title: "Молочный коктейль", img: "https://images.pexels.com/photos/3727250/pexels-photo-3727250.jpeg?w=800&q=80&auto=format&fit=crop", desc: "Классический сладкий напиток с мороженым", category: "Напитки", time: "5 мин", servings: "2", difficulty: "Легко", calories: 90, weight: "500 мл", protein: 3, fat: 4, carbs: 14, ingredients: ["Молоко — 300 мл","Мороженое — 150 г","Банан — 1 шт","Сироп — по вкусу"], steps: ["Нарежьте банан кусочками.","Поместите в блендер молоко, мороженое и банан.","Взбивайте на высокой скорости 1-2 минуты.","Разлейте по стаканам и подавайте сразу."] },
  { id: 29, title: "Панкейки", img: "https://images.pexels.com/photos/376464/pexels-photo-376464.jpeg?w=800&q=80&auto=format&fit=crop", desc: "Пышные американские оладьи на кефире", category: "Завтрак", time: "20 мин", servings: "3", difficulty: "Легко", calories: 220, weight: "400 г", protein: 6, fat: 8, carbs: 30, ingredients: ["Мука — 200 г","Кефир — 200 мл","Яйцо — 1 шт","Сахар — 1 ст.л.","Сода — 0.5 ч.л.","Масло для жарки"], steps: ["Смешайте кефир с содой, оставьте на 5 минут.","Взбейте яйцо с сахаром, добавьте кефир.","Всыпьте муку, замесите густое тесто.","Жарьте на разогретой сковороде с небольшим количеством масла.","Жарьте с двух сторон до золотистого цвета."] },
  { id: 30, title: "Ленивая овсянка", img: "https://images.unsplash.com/photo-1517673132405-a56a62b18caf?w=800&q=80&auto=format&fit=crop", desc: "Завтрак, который готовится вечером (овсянка в банке)", category: "Завтрак", time: "5 мин + ночь", servings: "1", difficulty: "Легко", calories: 180, weight: "250 г", protein: 7, fat: 5, carbs: 28, ingredients: ["Овсяные хлопья — 40 г","Молоко или йогурт — 100 мл","Семена чиа — 1 ч.л.","Фрукты/ягоды","Мёд"], steps: ["Смешайте хлопья, семена чиа и молоко в банке.","Добавьте ложку мёда и перемешайте.","Закройте крышкой и уберите в холодильник на ночь.","Утром добавьте свежие фрукты или ягоды."] }  { id: 11, title: "Грибной крем-суп", img: "https://images.pexels.com/photos/2548840/pexels-photo-2548840.jpeg?w=800&q=80&auto=format&fit=crop", desc: "Бархатистый суп из шампиньонов со сливками", category: "Супы", time: "40 мин", servings: "4", difficulty: "Средне", calories: 140, weight: "1.4 кг", protein: 5, fat: 11, carbs: 7, ingredients: ["Шампиньоны — 400 г","Лук — 1 шт","Сливки — 200 мл","Картофель — 2 шт","Масло — 30 г","Соль, перец","Зелень"], steps: ["Обжарьте лук на масле до прозрачности.","Добавьте нарезанные грибы, жарьте 10 мин.","Добавьте картофель и воду, варите 15 мин.","Пробейте суп блендером до однородности.","Влейте сливки, прогрейте.","Подавайте с зеленью и сухариками."] },
  { id: 12, title: "Тирамису", img: "https://images.unsplash.com/photo-1571877227200-a0d98ea607e9?w=800&q=80&auto=format&fit=crop", desc: "Итальянский десерт с маскарпоне и кофе", category: "Десерт", time: "30 мин + охлаждение", servings: "6", difficulty: "Средне", calories: 320, weight: "900 г", protein: 6, fat: 20, carbs: 30, ingredients: ["Маскарпоне — 500 г","Савоярди — 200 г","Яйца — 4 шт","Сахар — 100 г","Кофе — 200 мл","Какао — 2 ст.л."], steps: ["Сварите крепкий кофе, остудите.","Взбейте яйца с сахаром.","Добавьте маскарпоне, перемешайте.","Обмакните савоярди в кофе, выложите слоем.","Чередуйте слои печенья и крема.","Посыпьте какао, охладите 4 часа."] },
  { id: 13, title: "Сырники", img: "img/syrniki.jpg", desc: "Нежные творожные сырники на завтрак", category: "Завтрак", time: "25 мин", servings: "3", difficulty: "Легко", calories: 210, weight: "500 г", protein: 16, fat: 8, carbs: 22, ingredients: ["Творог — 400 г","Яйцо — 1 шт","Мука — 3 ст.л.","Сахар — 2 ст.л.","Ванилин — щепотка","Растительное масло"], steps: ["Разомните творог вилкой.","Добавьте яйцо, сахар и ванилин.","Всыпьте муку, замесите массу.","Сформируйте сырники, обваляйте в муке.","Обжарьте на среднем огне с двух сторон.","Подавайте со сметаной или вареньем."] },
  { id: 14, title: "Оливье", img: "https://images.pexels.com/photos/35572936/pexels-photo-35572936.jpeg?w=800&q=80&auto=format&fit=crop", desc: "Классический праздничный салат", category: "Салаты", time: "40 мин", servings: "6", difficulty: "Легко", calories: 190, weight: "1.3 кг", protein: 6, fat: 15, carbs: 10, ingredients: ["Картофель — 4 шт","Морковь — 2 шт","Яйца — 4 шт","Колбаса — 300 г","Огурцы солёные — 3 шт","Горошек — 1 банка","Майонез"], steps: ["Отварите картофель, морковь и яйца.","Остудите и нарежьте кубиками.","Нарежьте колбасу и огурцы.","Добавьте горошек.","Заправьте майонезом.","Посолите и перемешайте."] },
  { id: 15, title: "Плов", img: "https://images.pexels.com/photos/14286683/pexels-photo-14286683.jpeg?w=800&q=80&auto=format&fit=crop", desc: "Узбекский плов с бараниной и морковью", category: "Основное", time: "1.5 ч", servings: "6", difficulty: "Сложно", calories: 300, weight: "2 кг", protein: 12, fat: 10, carbs: 35, ingredients: ["Рис — 500 г","Баранина — 600 г","Морковь — 4 шт","Лук — 2 шт","Чеснок — 1 головка","Растительное масло","Зира, барбарис, соль"], steps: ["Обжарьте мясо до корочки в казане.","Добавьте лук, жарьте до золотистого.","Добавьте морковь соломкой.","Влейте воду, тушите 20 мин.","Выложите рис, добавьте специи и чеснок.","Варите под крышкой 20 мин, дайте постоять."] },
  { id: 16, title: "Стейк из говядины", img: "https://images.unsplash.com/photo-1546964124-0cce460f38ef?w=800&q=80&auto=format&fit=crop", desc: "Сочный стейк рибай с розмарином", category: "Основное", time: "20 мин", servings: "1", difficulty: "Средне", calories: 350, weight: "300 г", protein: 25, fat: 22, carbs: 0, ingredients: ["Стейк рибай — 300 г","Сливочное масло — 30 г","Чеснок — 2 зубчика","Розмарин","Соль, перец","Оливковое масло"], steps: ["Достаньте стейк за 30 мин до готовки.","Посолите и поперчите с двух сторон.","Разогрейте сковороду до максимума.","Обжарьте по 2–3 мин с каждой стороны.","Добавьте масло, чеснок, розмарин, полейте стейк.","Дайте отдохнуть 5 мин перед подачей."] },
  { id: 17, title: "Брускетта", img: "https://images.unsplash.com/photo-1572695157366-5e585ab2b69f?w=800&q=80&auto=format&fit=crop", desc: "Итальянская закуска с томатами на тостах", category: "Закуски", time: "15 мин", servings: "4", difficulty: "Легко", calories: 160, weight: "350 г", protein: 5, fat: 6, carbs: 20, ingredients: ["Багет — 1 шт","Помидоры — 4 шт","Чеснок — 2 зубчика","Базилик","Оливковое масло","Соль, перец"], steps: ["Нарежьте багет ломтиками.","Подсушите в духовке или на гриле.","Натрите тосты чесноком.","Нарежьте помидоры кубиками.","Смешайте с базиликом, маслом, солью.","Выложите томаты на тосты."] },
  { id: 18, title: "Ризотто с грибами", img: "https://images.unsplash.com/photo-1476124369491-e7addf5db371?w=800&q=80&auto=format&fit=crop", desc: "Кремовое итальянское ризотто с шампиньонами", category: "Основное", time: "35 мин", servings: "3", difficulty: "Средне", calories: 250, weight: "900 г", protein: 8, fat: 9, carbs: 28, ingredients: ["Рис арборио — 300 г","Шампиньоны — 300 г","Лук — 1 шт","Бульон — 1 л","Пармезан — 50 г","Белое вино — 100 мл","Масло"], steps: ["Обжарьте лук и грибы на масле.","Добавьте рис, обжарьте 1 мин.","Влейте вино, дайте испариться.","Постепенно добавляйте горячий бульон, помешивая.","Готовьте 18–20 мин до кремовой текстуры.","Добавьте пармезан и масло, перемешайте."] },
  { id: 19, title: "Шоколадный брауни", img: "https://images.unsplash.com/photo-1606313564200-e75d5e30476c?w=800&q=80&auto=format&fit=crop", desc: "Влажный шоколадный брауни с орехами", category: "Десерт", time: "45 мин", servings: "8", difficulty: "Легко", calories: 400, weight: "800 г", protein: 5, fat: 22, carbs: 40, ingredients: ["Тёмный шоколад — 200 г","Масло — 150 г","Яйца — 3 шт","Сахар — 200 г","Мука — 100 г","Грецкие орехи — 100 г","Какао — 2 ст.л."], steps: ["Растопите шоколад с маслом.","Взбейте яйца с сахаром.","Смешайте шоколадную массу с яйцами.","Добавьте муку и какао.","Вмешайте орехи, вылейте в форму.","Выпекайте 25 мин при 180°C."] },
  { id: 20, title: "Лимонад домашний", img: "https://images.unsplash.com/photo-1621263764928-df1444c5e859?w=800&q=80&auto=format&fit=crop", desc: "Освежающий лимонад с мятой и лимоном", category: "Напитки", time: "10 мин", servings: "4", difficulty: "Легко", calories: 45, weight: "1.2 л", protein: 0, fat: 0, carbs: 11, ingredients: ["Лимоны — 3 шт","Сахар — 100 г","Вода — 1 л","Мята — пучок","Лёд — по вкусу"], steps: ["Вскипятите воду с сахаром, остудите.","Выжмите сок из лимонов.","Смешайте сок с сиропом.","Добавьте мяту и лёд.","Дайте настояться 10 мин.","Подавайте охлаждённым."] },
  { id: 21, title: "Окрошка", img: "https://images.pexels.com/photos/5638247/pexels-photo-5638247.jpeg?w=800&q=80&auto=format&fit=crop", desc: "Освежающий летний холодный суп на квасе", category: "Супы", time: "30 мин", servings: "4", difficulty: "Легко", calories: 60, weight: "1.5 кг", protein: 4, fat: 3, carbs: 5, ingredients: ["Квас — 1 л","Картофель — 3 шт","Яйца — 3 шт","Колбаса — 200 г","Огурцы — 2 шт","Редис — 5 шт","Зелень","Сметана"], steps: ["Отварите картофель и яйца, остудите.","Нарежьте картофель, яйца, колбасу и овощи мелкими кубиками.","Смешайте все ингредиенты в кастрюле.","Добавьте мелко нарезанную зелень и соль.","Залейте квасом и добавьте ложку сметаны перед подачей."] },
  { id: 22, title: "Бефстроганов", img: "https://images.unsplash.com/photo-1534080564583-6be75777b70a?w=800&q=80&auto=format&fit=crop", desc: "Нежная говядина в сливочно-грибном соусе", category: "Основное", time: "40 мин", servings: "4", difficulty: "Средне", calories: 220, weight: "800 г", protein: 18, fat: 14, carbs: 6, ingredients: ["Говядина — 500 г","Шампиньоны — 200 г","Лук — 1 шт","Сливки — 200 мл","Мука — 1 ст.л.","Соль, перец","Масло"], steps: ["Нарежьте мясо тонкими брусочками, обжарьте на масле до румяной корочки.","Добавьте лук и грибы, жарьте 10 минут.","Посыпьте мукой, перемешайте.","Влейте сливки, посолите и поперчите.","Тушите 10-15 минут на медленном огне до загустения."] },
  { id: 23, title: "Капрезе", img: "https://images.unsplash.com/photo-1592417817098-8fd3d9eb14a5?w=800&q=80&auto=format&fit=crop", desc: "Итальянская закуска из томатов, моцареллы и базилика", category: "Закуски", time: "10 мин", servings: "2", difficulty: "Легко", calories: 180, weight: "300 г", protein: 10, fat: 12, carbs: 4, ingredients: ["Помидоры — 3 шт","Моцарелла — 200 г","Базилик — пучок","Оливковое масло","Бальзамический соус","Соль, перец"], steps: ["Нарежьте помидоры и моцареллу кружочками одинаковой толщины.","Выложите на тарелку, чередуя томат и сыр.","Добавьте листья базилика.","Полейте оливковым маслом и бальзамическим соусом.","Посолите и поперчите по вкусу."] },
  { id: 24, title: "Картофельное пюре", img: "https://images.unsplash.com/photo-1600628421066-f6bda6a7b976?w=800&q=80&auto=format&fit=crop", desc: "Идеальный гарнир — нежное и сливочное пюре", category: "Основное", time: "30 мин", servings: "4", difficulty: "Легко", calories: 130, weight: "600 г", protein: 3, fat: 6, carbs: 18, ingredients: ["Картофель — 700 г","Молоко — 150 мл","Сливочное масло — 50 г","Соль, перец","Зелень"], steps: ["Очистите картофель и отварите до мягкости в подсоленной воде.","Слейте воду, добавьте сливочное масло.","Разомните картофель толкушкой.","Влейте горячее молоко, продолжая помешивать.","Взбейте до однородности, добавьте зелень."] },
  { id: 25, title: "Куриный бульон", img: "https://images.pexels.com/photos/539451/pexels-photo-539451.jpeg?w=800&q=80&auto=format&fit=crop", desc: "Прозрачный, наваристый бульон для восстановления сил", category: "Супы", time: "1.5 ч", servings: "4", difficulty: "Легко", calories: 50, weight: "2 л", protein: 3, fat: 2, carbs: 0, ingredients: ["Куриная тушка — 1 шт","Морковь — 1 шт","Лук — 1 шт","Лавровый лист","Перец горошком","Соль","Вода — 2.5 л"], steps: ["Промойте курицу, залейте холодной водой и доведите до кипения.","Снимите пену, убавьте огонь.","Добавьте целую морковь, луковицу и специи.","Варите на медленном огне 1-1.5 часа.","Процедите бульон, мясо можно использовать отдельно."] },
  { id: 26, title: "Гречка с грибами", img: "https://images.unsplash.com/photo-1543339308-43e59d6b73a6?w=800&q=80&auto=format&fit=crop", desc: "Сытное и полезное блюдо на каждый день", category: "Основное", time: "30 мин", servings: "3", difficulty: "Легко", calories: 160, weight: "700 г", protein: 6, fat: 5, carbs: 25, ingredients: ["Гречка — 200 г","Шампиньоны — 300 г","Лук — 1 шт","Масло — 30 г","Соль, перец","Вода — 400 мл"], steps: ["Промойте гречку, залейте водой и варите до готовности.","Нарежьте лук и грибы.","Обжарьте лук на масле до золотистого цвета, добавьте грибы.","Жарьте грибы до испарения жидкости.","Смешайте готовую гречку с грибами, посолите и поперчите."] },
  { id: 27, title: "Чесночные гренки", img: "https://images.unsplash.com/photo-1573140247632-f8fd74997d5c?w=800&q=80&auto=format&fit=crop", desc: "Хрустящая закуска к супу или пиву", category: "Закуски", time: "15 мин", servings: "2", difficulty: "Легко", calories: 350, weight: "200 г", protein: 7, fat: 12, carbs: 45, ingredients: ["Белый хлеб — 4 ломтика","Чеснок — 3 зубчика","Оливковое масло — 3 ст.л.","Соль","Зелень"], steps: ["Нарежьте хлеб брусочками.","Смешайте масло с выдавленным чесноком и солью.","Обмакните каждый кусочек хлеба в масло.","Выложите на противень и запекайте при 180°C 10 минут до хруста.","Посыпьте зеленью."] },
  { id: 28, title: "Молочный коктейль", img: "https://images.pexels.com/photos/3727250/pexels-photo-3727250.jpeg?w=800&q=80&auto=format&fit=crop", desc: "Классический сладкий напиток с мороженым", category: "Напитки", time: "5 мин", servings: "2", difficulty: "Легко", calories: 90, weight: "500 мл", protein: 3, fat: 4, carbs: 14, ingredients: ["Молоко — 300 мл","Мороженое — 150 г","Банан — 1 шт","Сироп — по вкусу"], steps: ["Нарежьте банан кусочками.","Поместите в блендер молоко, мороженое и банан.","Взбивайте на высокой скорости 1-2 минуты.","Разлейте по стаканам и подавайте сразу."] },

  /* --- ЛОГИКА ТЕМЫ --- */
function toggleTheme() {
  const body = document.documentElement;
  const isDark = body.getAttribute('data-theme') === 'dark';
  body.setAttribute('data-theme', isDark ? 'light' : 'dark');
  document.getElementById('themeToggle').textContent = isDark ? '🌙' : '☀️';
  localStorage.setItem('recipe_theme', isDark ? 'light' : 'dark');
}
// Инициализация темы
if (localStorage.getItem('recipe_theme') === 'dark') {
  document.documentElement.setAttribute('data-theme', 'dark');
  document.getElementById('themeToggle').textContent = '☀️';
}

/* --- УВЕДОМЛЕНИЯ (TOASTS) --- */
function showToast(message, type = 'success') {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.innerHTML = (type === 'success' ? '✅ ' : '❌ ') + message;
  container.appendChild(toast);
  setTimeout(() => {
    toast.style.opacity = '0';
    setTimeout(() => toast.remove(), 300);
  }, 3000);
}

/* --- СПИСОК ПОКУПОК --- */
let shoppingList = JSON.parse(localStorage.getItem('recipe_shop_list') || '[]');

function updateShopBadge() {
  const badge = document.getElementById('shopBadge');
  if (shoppingList.length > 0) {
    badge.style.display = 'flex';
    badge.textContent = shoppingList.length;
  } else {
    badge.style.display = 'none';
  }
}
updateShopBadge();

function addToShoppingList(ingredient, recipeTitle) {
  const itemText = `${ingredient} (${recipeTitle})`;
  if (!shoppingList.includes(itemText)) {
    shoppingList.push(itemText);
    localStorage.setItem('recipe_shop_list', JSON.stringify(shoppingList));
    updateShopBadge();
    showToast("Добавлено в список покупок");
  } else {
    showToast("Уже в списке!", "error");
  }
}

function openShoppingList() {
  const modal = document.getElementById('shopModal');
  const list = document.getElementById('shopList');
  
  if (shoppingList.length === 0) {
    list.innerHTML = '<div style="text-align:center; color:var(--muted); padding:20px;">Список пуст 🍽️</div>';
  } else {
    list.innerHTML = shoppingList.map((item, i) => `
      <li class="ingr-item">
        <span>${item}</span>
        <button class="add-to-cart" style="background:#ffe3e3; color:#d63031;" onclick="removeFromShop(${i})">✕</button>
      </li>
    `).join('');
  }
  modal.classList.add('open');
}

function removeFromShop(index) {
  shoppingList.splice(index, 1);
  localStorage.setItem('recipe_shop_list', JSON.stringify(shoppingList));
  updateShopBadge();
  openShoppingList(); // Перерисовываем
}

function clearShoppingList() {
  shoppingList = [];
  localStorage.setItem('recipe_shop_list', JSON.stringify(shoppingList));
  updateShopBadge();
  openShoppingList();
}

/* --- РЕЖИМ ГОТОВКИ --- */
let cookSteps = [];
let currentStepIndex = 0;

function startCooking() {
  const r = recipes.find(x => x.id === currentModalId);
  if (!r) return;
  cookSteps = r.steps;
  currentStepIndex = 0;
  document.getElementById('cookTitle').textContent = r.title;
  closeModal();
  updateCookingUI();
  document.getElementById('cooking-mode').style.display = 'flex';
}

function updateCookingUI() {
  document.getElementById('cookText').textContent = cookSteps[currentStepIndex];
  document.getElementById('cookProgress').textContent = `Шаг ${currentStepIndex + 1} из ${cookSteps.length}`;
}
function nextStep() { if (currentStepIndex < cookSteps.length - 1) { currentStepIndex++; updateCookingUI(); } else { closeCooking(); showToast("Приятного аппетита! 🍽️"); } }
function prevStep() { if (currentStepIndex > 0) { currentStepIndex--; updateCookingUI(); } }
function closeCooking() { document.getElementById('cooking-mode').style.display = 'none'; }

/* --- ИЗБРАННОЕ --- */
let favorites = JSON.parse(localStorage.getItem("recipe_favorites") || "[]");
function isFav(id) { return favorites.includes(id); }
function toggleFav(id) {
  if (isFav(id)) favorites = favorites.filter(x => x !== id);
  else favorites.push(id);
  localStorage.setItem("recipe_favorites", JSON.stringify(favorites));
  renderGrid();
  const mBtn = document.getElementById("mFavBtn");
  if (mBtn && mBtn.dataset.id == id) mBtn.textContent = isFav(id) ? "❤️" : "🤍";
}
function toggleFavFromModal() { if (currentModalId) toggleFav(currentModalId); }

/* --- ФИЛЬТРЫ И РЕНДЕР --- */
let currentFilter = "Все", searchQuery = "", ingredientQuery = "";
const grid = document.getElementById("grid");
const categories = ["Все", ...new Set(recipes.map(r => r.category))];

function renderFilters() {
  const allBtns = categories.map(cat => `<button class="filter-btn ${cat === currentFilter ? "active" : ""}" data-cat="${cat}">${cat}</button>`).join("");
  const favBtn = `<button class="filter-btn ${currentFilter === "Избранное" ? "active" : ""}" data-cat="Избранное">❤️ Избранное</button>`;
  document.getElementById("filters").innerHTML = allBtns + favBtn;
  document.querySelectorAll(".filter-btn").forEach(btn => {
    btn.onclick = () => { currentFilter = btn.dataset.cat; renderFilters(); renderGrid(); };
  });
}

function renderGrid() {
  let filtered = recipes.filter(r => {
    let matchCat = currentFilter === "Все" ? true : currentFilter === "Избранное" ? isFav(r.id) : r.category === currentFilter;
    if (!matchCat) return false;
    const q = searchQuery.toLowerCase().trim();
    if (q && !r.title.toLowerCase().includes(q) && !r.desc.toLowerCase().includes(q)) return false;
    return true;
  });

  if (ingredientQuery.trim() !== "") {
    const terms = ingredientQuery.toLowerCase().split(/[, ]+/).filter(t => t.length > 1);
    if (terms.length > 0) {
      filtered = filtered.map(r => {
        let match = 0;
        const ings = r.ingredients.join(" ").toLowerCase();
        terms.forEach(t => { if (ings.includes(t)) match++; });
        return { ...r, match };
      }).filter(r => r.match > 0).sort((a, b) => b.match - a.match);
    }
  }

  // Сортировка
  const sortMethod = document.getElementById('sortSelect').value;
  if (sortMethod === 'time') {
    filtered.sort((a, b) => parseInt(a.time) - parseInt(b.time));
  } else if (sortMethod === 'calories') {
    filtered.sort((a, b) => a.calories - b.calories);
  } else if (sortMethod === 'title') {
    filtered.sort((a, b) => a.title.localeCompare(b.title));
  }

  if (filtered.length === 0) {
    grid.innerHTML = `<div style="text-align:center; grid-column:1/-1; padding:40px; font-size:20px; color:var(--muted);">Ничего не найдено 🍽️</div>`;
    return;
  }

  grid.innerHTML = filtered.map(r => {
    const displayImg = customImages[r.id] || r.img;
    return `
    <div class="card" onclick="openModal(${r.id})">
      <div class="card-image">
        <img src="${displayImg}" loading="lazy" onerror="this.src='https://via.placeholder.com/400x200?text=No+Image'">
        <button class="fav-btn ${isFav(r.id) ? "active" : ""}" onclick="event.stopPropagation();toggleFav(${r.id})">${isFav(r.id) ? "❤️" : "🤍"}</button>
      </div>
      <div class="card-body">
        <div class="badge-row">
          <span class="badge">${r.category}</span>
          <span class="badge cal">🔥 ${r.calories} ккал</span>
          <span class="badge time">⏱ ${r.time}</span>
        </div>
        <div class="card-title">${r.title}</div>
        <div class="card-desc">${r.desc}</div>
        <div class="macros-row">
          <span>Б: ${r.protein || 0}г</span>
          <span>Ж: ${r.fat || 0}г</span>
          <span>У: ${r.carbs || 0}г</span>
        </div>
      </div>
    </div>`;
  }).join("");
}

/* --- МОДАЛЬНОЕ ОКНО РЕЦЕПТА --- */
function openModal(id) {
  const r = recipes.find(x => x.id === id);
  if (!r) return;
  currentModalId = id;
  const displayImg = customImages[r.id] || r.img;
  
  document.getElementById("mImg").src = displayImg;
  document.getElementById("mTitle").textContent = r.title;
  document.getElementById("mDesc").textContent = r.desc;
  document.getElementById("mTime").textContent = r.time;
  document.getElementById("mWeight").textContent = r.weight;
  document.getElementById("mDiff").textContent = r.difficulty;
  document.getElementById("mCal").textContent = r.calories;
  
  document.getElementById("mIngr").innerHTML = r.ingredients.map(i => `
    <li class="ingr-item">
      <span>${i}</span>
      <button class="add-to-cart" onclick="addToShoppingList('${i.replace(/'/g, "\\'")}', '${r.title}')">+</button>
    </li>
  `).join("");
  
  document.getElementById("mSteps").innerHTML = r.steps.map(s => `<li class="step-item">${s}</li>`).join("");

  // Админ блок
  document.getElementById("uploadRow").style.display = isAdmin ? "flex" : "none";
  document.getElementById("resetImgBtn").style.display = customImages[r.id] ? "inline-block" : "none";
  document.getElementById("fileInput").value = "";

  const mBtn = document.getElementById("mFavBtn");
  mBtn.dataset.id = id;
  mBtn.textContent = isFav(id) ? "❤️" : "🤍";

  document.getElementById("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}

function closeModal() { document.getElementById("modal").classList.remove("open"); document.body.style.overflow = ""; currentModalId = null; }
document.getElementById("modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });
document.getElementById("shopModal").addEventListener("click", e => { if (e.target.id === "shopModal") e.target.classList.remove("open"); });

document.getElementById("searchInput").addEventListener("input", e => { searchQuery = e.target.value; renderGrid(); });
document.getElementById("ingredientInput").addEventListener("input", e => { ingredientQuery = e.target.value; renderGrid(); });

/* --- АДМИНКА И ЗАГРУЗКА (Supabase) --- */
const ADMIN_PASSWORD = "mikerecept6752";
let isAdmin = sessionStorage.getItem("recipe_isAdmin") === "true";

function toggleAdminMode() {
  if (isAdmin) {
    isAdmin = false; sessionStorage.setItem("recipe_isAdmin", "false"); updateAdminUI(); closeModal();
  } else {
    const pass = prompt("Введите пароль:");
    if (pass === ADMIN_PASSWORD) {
      isAdmin = true; sessionStorage.setItem("recipe_isAdmin", "true"); updateAdminUI(); showToast("Доступ разрешен!");
    } else if (pass !== null) { showToast("Неверный пароль!", "error"); }
  }
}

function updateAdminUI() {
  const btn = document.getElementById("adminBtn");
  btn.textContent = isAdmin ? "🔓" : "🔒";
  btn.classList.toggle("active", isAdmin);
  const uploadRow = document.getElementById("uploadRow");
  if (uploadRow) uploadRow.style.display = isAdmin ? "flex" : "none";
}

async function handleImageUpload(event) {
  if (!isAdmin) return showToast("Нет прав!", "error");
  const file = event.target.files[0];
  if (!file || !currentModalId) return;

  showToast("Загрузка фото...");
  const reader = new FileReader();
  reader.onload = async function(e) {
    const img = new Image();
    img.onload = async function() {
      const canvas = document.createElement('canvas');
      const MAX_WIDTH = 800;
      let scale = img.width > MAX_WIDTH ? MAX_WIDTH / img.width : 1;
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      
      const base64 = canvas.toDataURL('image/jpeg', 0.8);
      const response = await fetch(base64);
      const blob = await response.blob();

      const fileName = `recipe_${currentModalId}_${Date.now()}.jpg`;
      const { data: uploadData, error: uploadError } = await supabaseClient.storage.from('recipes').upload(fileName, blob);

      if (uploadError) return showToast("Ошибка загрузки: " + uploadError.message, "error");

      const { data: urlData } = supabaseClient.storage.from('recipes').getPublicUrl(fileName);
      const { error: dbError } = await supabaseClient.from('custom_images').upsert({ recipe_id: currentModalId, image_url: urlData.publicUrl }, { onConflict: 'recipe_id' });

      if (dbError) return showToast("Ошибка базы: " + dbError.message, "error");
      
      showToast("Фото обновлено!");
      loadImagesFromCloud();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

async function resetImage() {
  if (!isAdmin || !currentModalId) return;
  if (!confirm("Вернуть стандартное фото?")) return;
  const { error } = await supabaseClient.from('custom_images').delete().eq('recipe_id', currentModalId);
  if (error) return showToast("Ошибка удаления", "error");
  showToast("Фото сброшено!");
  loadImagesFromCloud();
}

// Старт
updateAdminUI();
renderFilters();
renderGrid();
</script>
