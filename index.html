<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Книга Рецептов 🍳</title>
<style>
  :root {
    --bg: #fdf8f0;
    --card: #ffffff;
    --primary: #e67e22;
    --primary-dark: #d35400;
    --text: #2c2c2c;
    --muted: #777;
    --border: #ede0d0;
    --shadow: 0 4px 20px rgba(0,0,0,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }

  header {
    background: linear-gradient(135deg, #e67e22 0%, #d35400 100%);
    color: white;
    padding: 40px 20px;
    text-align: center;
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: "🍳";
    position: absolute;
    font-size: 200px;
    opacity: 0.08;
    top: -40px;
    left: 30px;
    transform: rotate(-15deg);
  }
  header::after {
    content: "🥗";
    position: absolute;
    font-size: 200px;
    opacity: 0.08;
    bottom: -60px;
    right: 30px;
    transform: rotate(15deg);
  }
  header h1 { font-size: 42px; margin-bottom: 8px; position: relative; z-index: 1; }
  header p  { font-size: 17px; opacity: 0.95; position: relative; z-index: 1; }

  .toolbar {
    max-width: 1200px;
    margin: 24px auto;
    padding: 0 20px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
  }
  .search-box {
    flex: 1;
    min-width: 240px;
    max-width: 400px;
    position: relative;
  }
  .search-box input {
    width: 100%;
    padding: 12px 16px 12px 44px;
    border: 2px solid var(--border);
    border-radius: 30px;
    font-size: 15px;
    background: var(--card);
    transition: all 0.2s;
    outline: none;
  }
  .search-box input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(230, 126, 34, 0.15);
  }
  .search-box::before {
    content: "🔍";
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 16px;
  }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .filter-btn {
    padding: 10px 18px;
    border: 2px solid var(--border);
    background: var(--card);
    color: var(--text);
    border-radius: 30px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    transition: all 0.2s;
  }
  .filter-btn:hover { border-color: var(--primary); color: var(--primary); }
  .filter-btn.active {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
  }
  .filter-btn.fav-filter.active {
    background: #e74c3c;
    border-color: #e74c3c;
    color: white;
  }

  .grid {
    max-width: 1200px;
    margin: 0 auto 60px;
    padding: 0 20px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 24px;
  }
  .card {
    background: var(--card);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: transform 0.25s, box-shadow 0.25s;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  .card:hover {
    transform: translateY(-6px);
    box-shadow: 0 12px 32px rgba(0,0,0,0.14);
  }
  .card-image {
    height: 200px;
    overflow: hidden;
    position: relative;
    background: #f0e6d8;
  }
  .card-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.4s;
    display: block;
  }
  .card:hover .card-image img { transform: scale(1.08); }
  .fav-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 38px;
    height: 38px;
    border: none;
    background: rgba(255,255,255,0.9);
    border-radius: 50%;
    cursor: pointer;
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s, background 0.2s;
    z-index: 3;
    line-height: 1;
  }
  .fav-btn:hover { transform: scale(1.15); background: white; }
  .fav-btn.active { background: #ffe6e6; }
  .card-body {
    padding: 18px;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .card-title { font-size: 19px; font-weight: 700; color: var(--text); }
  .card-desc  { font-size: 14px; color: var(--muted); flex: 1; }
  .card-meta {
    display: flex;
    gap: 14px;
    font-size: 13px;
    color: var(--muted);
    border-top: 1px solid var(--border);
    padding-top: 12px;
    flex-wrap: wrap;
  }
  .card-meta span { display: flex; align-items: center; gap: 4px; }

  .badge-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .badge {
    display: inline-block;
    padding: 3px 10px;
    background: #fff4e6;
    color: var(--primary-dark);
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
  }
  .calories-badge {
    display: inline-block;
    padding: 3px 10px;
    background: #ffe6e6;
    color: #c0392b;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
  }
  .weight-badge {
    display: inline-block;
    padding: 3px 10px;
    background: #e8f4fd;
    color: #2980b9;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
  }

  .empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }
  .empty .emoji { font-size: 60px; display: block; margin-bottom: 12px; }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
    backdrop-filter: blur(4px);
  }
  .modal-overlay.open { display: flex; animation: fadeIn 0.2s; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp {
    from { transform: translateY(30px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .modal {
    background: var(--card);
    border-radius: 20px;
    max-width: 700px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    animation: slideUp 0.3s;
    position: relative;
  }
  .modal-hero {
    height: 240px;
    overflow: hidden;
    border-radius: 20px 20px 0 0;
    position: relative;
  }
  .modal-hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .modal-hero::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, rgba(0,0,0,0.05) 60%, rgba(0,0,0,0.35));
  }
  .modal-close {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 38px;
    height: 38px;
    border: none;
    background: rgba(255,255,255,0.9);
    border-radius: 50%;
    cursor: pointer;
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s, transform 0.2s;
    z-index: 2;
  }
  .modal-close:hover { background: white; transform: rotate(90deg); }
  .modal-fav {
    position: absolute;
    top: 16px;
    left: 16px;
    width: 42px;
    height: 42px;
    border: none;
    background: rgba(255,255,255,0.9);
    border-radius: 50%;
    cursor: pointer;
    font-size: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s, background 0.2s;
    z-index: 2;
    line-height: 1;
  }
  .modal-fav:hover { transform: scale(1.15); background: white; }
  .modal-fav.active { background: #ffe6e6; }

  .modal-header { padding: 22px 30px 4px; }
  .modal-header h2 { font-size: 26px; margin-bottom: 6px; }
  .modal-header p  { color: var(--muted); font-size: 15px; }

  .modal-body { padding: 18px 30px 30px; }
  .meta-row {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    padding: 16px 0;
    margin-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .meta-item { display: flex; flex-direction: column; gap: 2px; }
  .meta-item .label {
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .meta-item .value { font-size: 15px; font-weight: 600; }
  .meta-item .value.calories { color: #c0392b; }
  .meta-item .value.weight   { color: #2980b9; }

  .modal-body h3 {
    font-size: 17px;
    margin: 20px 0 10px;
    color: var(--primary-dark);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .modal-body ul, .modal-body ol {
    padding-left: 22px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .modal-body li { font-size: 15px; }
  .modal-body ol li::marker { color: var(--primary); font-weight: 700; }

  footer {
    text-align: center;
    padding: 30px 20px;
    color: var(--muted);
    font-size: 14px;
    border-top: 1px solid var(--border);
    max-width: 1200px;
    margin: 0 auto;
  }

  @media (max-width: 600px) {
    header h1 { font-size: 30px; }
    .grid { grid-template-columns: 1fr; }
    .modal-body { padding: 18px 20px 24px; }
    .modal-header { padding: 18px 20px 4px; }
    .modal-hero { height: 180px; }
  }
</style>
</head>

<header>
  <h1>🍳 Книга Рецептов</h1>

    <div class="modal-header">
      <h2 id="mTitle"></h2>
      <p id="mDesc"></p>

    <div class="modal-body">

        <div class="meta-item"><span class="label">Вес</span><span class="value weight" id="mWeight"></span></div>
        <div class="meta-item"><span class="label">Сложность</span><span class="value" id="mDiff"></span></div>
        <div class="meta-item"><span class="label">Калорийность</span><span class="value calories" id="mCal"></span></div>
      </div>
      <h3>🧾 Ингредиенты</h3>
      <ul id="mIngr"></ul>
      <h3>👨‍🍳 Приготовление</h3>
      <ol id="mSteps"></ol>
    </div>
  </div>
</div>

/* ---------- ИЗБРАННОЕ (localStorage) ---------- */
const FAV_KEY = "recipe_favorites";
let favorites = JSON.parse(localStorage.getItem(FAV_KEY) || "[]");

function saveFavorites() {
  localStorage.setItem(FAV_KEY, JSON.stringify(favorites));
}
function isFav(id) { return favorites.includes(id); }
function toggleFav(id) {
  if (isFav(id)) {
    favorites = favorites.filter(x => x !== id);
  } else {
    favorites.push(id);
  }
  saveFavorites();
  renderGrid();
  
  const mBtn = document.getElementById("mFavBtn");
  if (mBtn.dataset.id == id) {
    mBtn.textContent = isFav(id) ? "❤️" : "🤍";
    mBtn.classList.toggle("active", isFav(id));
  }
}

/* ---------- ФИЛЬТРЫ ---------- */
let currentFilter = "Все";
let searchQuery = "";

const grid = document.getElementById("grid");
const filtersEl = document.getElementById("filters");
const searchInput = document.getElementById("searchInput");

const categories = ["Все", ...new Set(recipes.map(r => r.category))];

function renderFilters() {
  const allBtns = categories.map(cat =>
    `<button class="filter-btn ${cat === currentFilter ? "active" : ""}" data-cat="${cat}">${cat}</button>`
  ).join("");
  const favBtn = `<button class="filter-btn fav-filter ${currentFilter === "Избранное" ? "active" : ""}" data-cat="Избранное">❤️ Избранное (${favorites.length})</button>`;
  filtersEl.innerHTML = allBtns + favBtn;

  filtersEl.querySelectorAll(".filter-btn").forEach(btn => {
    btn.onclick = () => {
      currentFilter = btn.dataset.cat;
      renderFilters();
      renderGrid();
    };
  });
}

/* ---------- СЕТКА ---------- */
function renderGrid() {
  const filtered = recipes.filter(r => {
    let matchCat;
    if (currentFilter === "Все") matchCat = true;
    else if (currentFilter === "Избранное") matchCat = isFav(r.id);
    else matchCat = r.category === currentFilter;

    const q = searchQuery.toLowerCase().trim();
    const matchSearch = !q ||
      r.title.toLowerCase().includes(q) ||
      r.desc.toLowerCase().includes(q) ||
      r.ingredients.some(i => i.toLowerCase().includes(q));
    return matchCat && matchSearch;
  });

  if (filtered.length === 0) {
    const msg = currentFilter === "Избранное"
      ? "В избранном пока пусто. Нажми на 🤍 на карточке, чтобы добавить."
      : "Ничего не найдено. Попробуйте другой запрос.";
    grid.innerHTML = `<div class="empty"><span class="emoji">🍽️</span>${msg}</div>`;
    return;
  }

  grid.innerHTML = filtered.map(r => `
    <div class="card" onclick="openModal(${r.id})">
      <div class="card-image">
        <img src="${r.img}" alt="${r.title}" loading="lazy"
             onerror="this.parentElement.innerHTML='<div style=&quot;display:flex;align-items:center;justify-content:center;height:100%;font-size:60px;&quot;>🍽️</div>'">
        <button class="fav-btn ${isFav(r.id) ? "active" : ""}"
                onclick="event.stopPropagation();toggleFav(${r.id})">
          ${isFav(r.id) ? "❤️" : "🤍"}
        </button>
      </div>
      <div class="card-body">
        <div class="badge-row">
          <span class="badge">${r.category}</span>
          <span class="calories-badge">🔥 ${r.calories} ккал/100г</span>
          <span class="weight-badge">⚖️ ${r.weight}</span>
        </div>
        <div class="card-title">${r.title}</div>
        <div class="card-desc">${r.desc}</div>
        <div class="card-meta">
          <span>⏱ ${r.time}</span>
          <span>👥 ${r.servings} порц.</span>
          <span>⭐ ${r.difficulty}</span>
        </div>
      </div>
    </div>
  `).join("");
}

/* ---------- МОДАЛЬНОЕ ОКНО ---------- */
let currentModalId = null;

function openModal(id) {
  const r = recipes.find(x => x.id === id);
  if (!r) return;
  currentModalId = id;
  document.getElementById("mImg").src = r.img;
  document.getElementById("mImg").alt = r.title;
  document.getElementById("mTitle").textContent = r.title;
  document.getElementById("mDesc").textContent = r.desc;
  document.getElementById("mCat").textContent = r.category;
  document.getElementById("mTime").textContent = r.time;
  document.getElementById("mServ").textContent = r.servings;
  document.getElementById("mWeight").textContent = r.weight;
  document.getElementById("mDiff").textContent = r.difficulty;
  document.getElementById("mCal").textContent = r.calories + " ккал / 100 г";
  document.getElementById("mIngr").innerHTML = r.ingredients.map(i => `<li>${i}</li>`).join("");
  document.getElementById("mSteps").innerHTML = r.steps.map(s => `<li>${s}</li>`).join("");

  const mBtn = document.getElementById("mFavBtn");
  mBtn.dataset.id = id;
  mBtn.textContent = isFav(id) ? "❤️" : "🤍";
  mBtn.classList.toggle("active", isFav(id));

  document.getElementById("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}

function toggleFavFromModal() {
  if (currentModalId != null) toggleFav(currentModalId);
}

function closeModal() {
  document.getElementById("modal").classList.remove("open");
  document.body.style.overflow = "";
  currentModalId = null;
}

document.getElementById("modal").addEventListener("click", e => {
  if (e.target.id === "modal") closeModal();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeModal();
});
searchInput.addEventListener("input", e => {
  searchQuery = e.target.value;
  renderGrid();
});

renderFilters();
renderGrid();
</script>
