<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Книга Рецептов 🍳 Premium</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f7f6; --card: #ffffff; --text: #1a1a1a; --muted: #666;
    --primary: #ff6b6b; --primary-hover: #ff5252; --primary-light: #ffe3e3;
    --secondary: #4ecdc4; --border: #e0e0e0; --shadow: 0 8px 30px rgba(0,0,0,0.06);
    --glass: rgba(255, 255, 255, 0.85); --badge-bg: #fff3cd; --badge-text: #856404;
  }
  
  [data-theme="dark"] {
    --bg: #121212; --card: #1e1e1e; --text: #f5f5f5; --muted: #a0a0a0;
    --primary: #ff6b6b; --primary-hover: #ff5252; --primary-light: #3a1c1c;
    --secondary: #4ecdc4; --border: #333333; --shadow: 0 8px 30px rgba(0,0,0,0.3);
    --glass: rgba(30, 30, 30, 0.85); --badge-bg: #332701; --badge-text: #ffda6a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
  
  body {
    background-color: var(--bg); color: var(--text); line-height: 1.6;
    transition: background-color 0.4s, color 0.4s;
    padding-bottom: 80px;
  }

  /* ---------- HEADER ---------- */
  header {
    position: sticky; top: 0; z-index: 50;
    background: var(--glass); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    padding: 15px 20px; display: flex; justify-content: space-between; align-items: center;
    box-shadow: 0 4px 20px rgba(0,0,0,0.05); border-bottom: 1px solid var(--border);
  }
  .logo { font-size: 24px; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 8px; }
  
  .header-controls { display: flex; gap: 12px; align-items: center; }
  .user-id-badge {
    font-size: 12px; font-weight: 700; background: var(--primary-light); color: var(--primary);
    padding: 6px 12px; border-radius: 20px; display: flex; align-items: center; gap: 5px;
  }
  .icon-btn {
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-size: 18px;
    display: flex; justify-content: center; align-items: center; transition: all 0.2s;
  }
  .icon-btn:hover { transform: scale(1.1); border-color: var(--primary); color: var(--primary); }
  .admin-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

  /* ---------- TOOLBAR ---------- */
  .toolbar { max-width: 1400px; margin: 30px auto; padding: 0 20px; display: flex; flex-direction: column; gap: 20px; }
  .search-row { display: flex; gap: 15px; flex-wrap: wrap; }
  .search-box { flex: 1; min-width: 250px; position: relative; }
  .search-box input {
    width: 100%; padding: 16px 20px 16px 50px; border: 2px solid transparent;
    border-radius: 16px; font-size: 15px; font-weight: 500;
    background: var(--card); color: var(--text); box-shadow: var(--shadow);
    transition: all 0.3s;
  }
  .search-box input:focus { border-color: var(--primary); outline: none; transform: translateY(-2px); }
  .search-box::before { content: "🔍"; position: absolute; left: 18px; top: 50%; transform: translateY(-50%); font-size: 18px; }
  .search-box.fridge::before { content: "🥦"; }
  
  .filters-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; }
  .filter-btn {
    padding: 8px 16px; border: 1px solid var(--border); background: var(--card); color: var(--text);
    border-radius: 20px; cursor: pointer; font-size: 13px; font-weight: 600; transition: all 0.2s;
  }
  .filter-btn:hover { border-color: var(--primary); color: var(--primary); }
  .filter-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
  
  .sort-select {
    padding: 10px 15px; border-radius: 12px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); font-weight: 600; cursor: pointer; outline: none;
  }

  /* ---------- GRID & CARDS (4 В РЯД) ---------- */
  .grid { 
    max-width: 1400px; margin: 0 auto 60px; padding: 0 20px; 
    display: grid; 
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); 
    gap: 20px; 
  }
  .card {
    background: var(--card); border-radius: 20px; overflow: hidden; box-shadow: var(--shadow);
    cursor: pointer; transition: all 0.3s ease; display: flex; flex-direction: column; border: 1px solid var(--border);
  }
  .card:hover { transform: translateY(-6px); box-shadow: 0 12px 30px rgba(0,0,0,0.15); }
  .card-image { height: 180px; position: relative; overflow: hidden; }
  .card-image img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s; }
  .card:hover .card-image img { transform: scale(1.1); }
  .fav-btn {
    position: absolute; top: 12px; right: 12px; width: 36px; height: 36px;
    border-radius: 50%; border: none; background: rgba(255,255,255,0.9); cursor: pointer;
    font-size: 18px; display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(5px); transition: transform 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  }
  .fav-btn:hover { transform: scale(1.15); }
  .fav-btn.active { background: #ffe3e3; }
  
  .card-body { padding: 15px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .badge-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .badge {
    padding: 3px 8px; border-radius: 10px; font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.5px; background: var(--badge-bg); color: var(--badge-text);
  }
  .badge.cal { background: #ffe3e3; color: #d63031; }
  .badge.time { background: #e3f2fd; color: #0984e3; }
  
  .card-title { font-size: 16px; font-weight: 800; line-height: 1.3; }
  .card-desc { font-size: 12px; color: var(--muted); flex: 1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  
  .macros-row { display: flex; gap: 6px; font-size: 11px; font-weight: 600; color: var(--muted); border-top: 1px dashed var(--border); padding-top: 10px; }
  .macros-row span { flex: 1; text-align: center; }

  /* ---------- MODALS ---------- */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none;
    align-items: center; justify-content: center; padding: 20px; z-index: 100; backdrop-filter: blur(5px);
  }
  .modal-overlay.open { display: flex; animation: fadeIn 0.3s; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  
  .modal {
    background: var(--card); border-radius: 30px; max-width: 800px; width: 100%;
    max-height: 90vh; overflow-y: auto; position: relative; animation: slideUp 0.4s; border: 1px solid var(--border);
  }
  .modal-hero { height: 300px; position: relative; }
  .modal-hero img { width: 100%; height: 100%; object-fit: cover; }
  .modal-close {
    position: absolute; top: 20px; right: 20px; width: 44px; height: 44px;
    border-radius: 50%; border: none; background: rgba(255,255,255,0.9); cursor: pointer;
    font-size: 24px; display: flex; align-items: center; justify-content: center; z-index: 2; transition: transform 0.2s;
  }
  .modal-close:hover { transform: rotate(90deg); }
  .modal-fav {
    position: absolute; top: 20px; left: 20px; width: 50px; height: 50px;
    border-radius: 50%; border: none; background: rgba(255,255,255,0.9); cursor: pointer;
    font-size: 26px; display: flex; align-items: center; justify-content: center; z-index: 2;
  }
  
  .modal-header { padding: 30px 40px 10px; }
  .modal-header h2 { font-size: 32px; font-weight: 800; margin-bottom: 10px; }
  .modal-header p { font-size: 16px; color: var(--muted); }
  
  .modal-body { padding: 20px 40px 40px; }
  
  .upload-row { margin-bottom: 25px; display: flex; gap: 15px; flex-wrap: wrap; }
  .btn-primary {
    padding: 12px 24px; background: var(--primary); color: white; border: none;
    border-radius: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s; font-size: 14px;
  }
  .btn-primary:hover { background: var(--primary-hover); transform: translateY(-2px); }
  .btn-secondary {
    padding: 12px 24px; background: var(--card); color: var(--text); border: 1px solid var(--border);
    border-radius: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s; font-size: 14px;
  }
  .btn-secondary:hover { border-color: var(--primary); color: var(--primary); }
  
  .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 30px; }
  .stat-box { background: var(--bg); padding: 15px; border-radius: 16px; text-align: center; }
  .stat-label { font-size: 12px; color: var(--muted); text-transform: uppercase; font-weight: 600; margin-bottom: 5px; }
  .stat-value { font-size: 18px; font-weight: 800; color: var(--primary); }
  
  .modal-body h3 { font-size: 20px; font-weight: 800; margin: 30px 0 15px; display: flex; align-items: center; gap: 10px; }
  
  .ingr-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
  .ingr-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 16px; background: var(--bg); border-radius: 12px; font-size: 15px; font-weight: 500;
  }
  .equip-grid { list-style: none; display: flex; flex-wrap: wrap; gap: 8px; }
  .equip-item {
    padding: 8px 14px; background: var(--bg); border: 1px solid var(--border);
    border-radius: 20px; font-size: 14px; font-weight: 600;
  }
  .add-to-cart {
    background: var(--primary-light); color: var(--primary); border: none;
    width: 32px; height: 32px; border-radius: 8px; cursor: pointer; font-weight: 800; font-size: 18px;
    display: flex; align-items: center; justify-content: center; transition: all 0.2s; flex-shrink: 0;
  }
  .add-to-cart:hover { background: var(--primary); color: white; }
  
  .steps-list { counter-reset: step-counter; list-style: none; display: flex; flex-direction: column; gap: 15px; }
  .step-item {
    position: relative; padding: 15px 20px 15px 60px; background: var(--bg); border-radius: 16px; font-size: 15px;
  }
  .step-item::before {
    counter-increment: step-counter; content: counter(step-counter);
    position: absolute; left: 15px; top: 50%; transform: translateY(-50%);
    width: 30px; height: 30px; background: var(--primary); color: white;
    border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800;
  }

  /* ---------- FAB & TOASTS ---------- */
  .fab {
    position: fixed; bottom: 30px; right: 30px; width: 65px; height: 65px;
    background: var(--primary); color: white; border-radius: 50%; border: none;
    font-size: 28px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; box-shadow: 0 8px 25px rgba(255, 107, 107, 0.4); z-index: 90;
    transition: transform 0.3s;
  }
  .fab:hover { transform: scale(1.1); }
  .fab-badge {
    position: absolute; top: -5px; right: -5px; background: #2d3436; color: white;
    font-size: 14px; font-weight: 800; width: 24px; height: 24px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; border: 2px solid var(--bg);
  }

  #toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
  .toast {
    background: var(--card); color: var(--text); padding: 15px 25px; border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15); font-weight: 600; display: flex; align-items: center; gap: 12px;
    animation: slideDown 0.3s ease-out; border-left: 5px solid var(--secondary);
  }
  .toast.error { border-left-color: #ff4757; }
  @keyframes slideDown { from { transform: translate(-50%, -20px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }

  /* ---------- COOKING MODE ---------- */
  #cooking-mode {
    position: fixed; inset: 0; background: var(--bg); z-index: 200;
    display: none; flex-direction: column; justify-content: center; align-items: center; padding: 20px;
  }
  .cook-step-box { max-width: 800px; text-align: center; animation: slideUp 0.5s; width: 100%; }
  .cook-step-text { font-size: 32px; font-weight: 700; margin: 40px 0; line-height: 1.4; }
  .cook-nav { display: flex; gap: 20px; margin-top: 40px; justify-content: center; width: 100%; }
  .cook-nav button { padding: 20px 40px; font-size: 22px; border-radius: 20px; font-weight: 800; flex: 1; max-width: 250px; }
  .cook-progress { font-size: 20px; font-weight: 800; color: var(--primary); background: var(--primary-light); padding: 10px 25px; border-radius: 30px; display: inline-block; }

  /* ---------- АДАПТИВ ПОД ТЕЛЕФОНЫ ---------- */
  @media (max-width: 768px) {
    .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 0 10px; }
    .card-image { height: 120px; }
    .card-body { padding: 10px; gap: 6px; }
    .card-title { font-size: 13px; }
    .card-desc { display: none; }
    .macros-row { font-size: 9px; padding-top: 6px; gap: 2px; }
    .badge { font-size: 8px; padding: 2px 5px; }
    .fav-btn { width: 28px; height: 28px; font-size: 14px; top: 5px; right: 5px; }
    
    .modal-header { padding: 20px; }
    .modal-body { padding: 15px 20px; }
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
    .search-row { flex-direction: column; }
    
    .cook-step-text { font-size: 24px; }
    .cook-nav { flex-direction: column; }
    .cook-nav button { max-width: 100%; }
    .user-id-badge { display: none; }
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div id="toast-container"></div>

<header>
  <div class="logo">🍳 RecipeBook</div>
  <div class="header-controls">
    <div class="user-id-badge" id="userIdDisplay" title="Ваш уникальный ID на этом устройстве">👤 ...</div>
    <button class="icon-btn" id="themeToggle" onclick="toggleTheme()" title="Переключить тему">🌙</button>
    <button class="icon-btn admin-btn" id="adminBtn" onclick="toggleAdminMode()" title="Режим администратора">🔒</button>
  </div>
</header>

<div class="toolbar">
  <div class="search-row">
    <div class="search-box"><input type="text" id="searchInput" placeholder="Поиск по названию..."></div>
    <div class="search-box fridge"><input type="text" id="ingredientInput" placeholder="Что в холодильнике?"></div>
  </div>
  <div class="filters-row">
    <div class="filters" id="filters"></div>
    <select class="sort-select" id="sortSelect" onchange="renderGrid()">
      <option value="default">По умолчанию</option>
      <option value="time">Быстрые ⏱</option>
      <option value="calories">Низкокалорийные 🔥</option>
      <option value="title">По алфавиту 🔤</option>
    </select>
  </div>
</div>

<div class="grid" id="grid"></div>

<button class="fab" onclick="openShoppingList()">
  🛒 <span class="fab-badge" id="shopBadge" style="display:none;">0</span>
</button>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-hero">
      <img id="mImg" src="" alt="">
      <button class="modal-fav" id="mFavBtn" onclick="toggleFavFromModal()">🤍</button>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-header">
      <h2 id="mTitle"></h2>
      <p id="mDesc"></p>
    </div>
    <div class="modal-body">
      <div class="upload-row" id="uploadRow" style="display: none;">
        <button class="btn-primary" onclick="document.getElementById('fileInput').click()">📷 Загрузить фото</button>
        <button class="btn-secondary" id="resetImgBtn" onclick="resetImage()" style="display:none;">🔄 Сбросить</button>
        <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleImageUpload(event)">
      </div>
      
      <div class="stats-grid">
        <div class="stat-box"><div class="stat-label">Время</div><div class="stat-value" id="mTime"></div></div>
        <div class="stat-box"><div class="stat-label">Вес</div><div class="stat-value" id="mWeight"></div></div>
        <div class="stat-box"><div class="stat-label">Ккал/100г</div><div class="stat-value" id="mCal"></div></div>
        <div class="stat-box"><div class="stat-label">Сложность</div><div class="stat-value" id="mDiff"></div></div>
      </div>

      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
        <h3>🧾 Ингредиенты <span style="font-size:13px; font-weight:600; color:var(--muted);" id="mServings"></span></h3>
        <button class="btn-primary" onclick="startCooking()">👨‍🍳 Начать готовку</button>
      </div>
      <ul class="ingr-list" id="mIngr"></ul>

      <h3>🍳 Инструменты и посуда</h3>
      <ul class="equip-grid" id="mEquip"></ul>

      <h3>📖 Приготовление</h3>
      <ol class="steps-list" id="mSteps"></ol>
    </div>
  </div>
</div>

<div class="modal-overlay" id="shopModal">
  <div class="modal" style="max-width: 500px;">
    <div class="modal-header" style="display:flex; justify-content:space-between; align-items:center;">
      <h2>🛒 Список покупок</h2>
      <button class="modal-close" style="position:static;" onclick="document.getElementById('shopModal').classList.remove('open')">✕</button>
    </div>
    <div class="modal-body">
      <ul class="ingr-list" id="shopList"></ul>
      <button class="btn-secondary" style="width:100%; margin-top:20px;" onclick="clearShoppingList()">Очистить</button>
    </div>
  </div>
</div>

<div id="cooking-mode">
  <div class="cook-step-box">
    <h2 id="cookTitle" style="color:var(--primary); font-size: 24px;">Название блюда</h2>
    <div class="cook-progress" id="cookProgress">Шаг 1 из 5</div>
    <div class="cook-step-text" id="cookText">Текст шага...</div>
    <div class="cook-nav">
      <button class="btn-secondary" onclick="prevStep()">← Назад</button>
      <button class="btn-primary" onclick="nextStep()">Далее →</button>
    </div>
    <button class="btn-secondary" style="margin-top:30px; border:none;" onclick="closeCooking()">Выйти из режима</button>
  </div>
</div>

<script>
/* =====================================================
   1. ГЕНЕРАЦИЯ ПОЛЬЗОВАТЕЛЬСКОГО ID
   ===================================================== */
let userId = localStorage.getItem('recipe_user_id');
if (!userId) {
  userId = 'user_' + Math.random().toString(36).substr(2, 9);
  localStorage.setItem('recipe_user_id', userId);
}
document.getElementById('userIdDisplay').textContent = '👤 ' + userId;

/* =====================================================
   2. ВАШИ КЛЮЧИ SUPABASE
   ===================================================== */
const SUPABASE_URL = "https://ooweerxaqizvovadsecb.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_8SvPI97piMkxAmoZ8vUbIQ_U7YoGp4w";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let customImages = {};
let currentModalId = null;

async function loadImagesFromCloud() {
  const { data, error } = await supabaseClient.from('custom_images').select('*');
  if (error) return console.error(error);
  customImages = {};
  if (data) data.forEach(item => { customImages[item.recipe_id] = item.image_url; });
  renderGrid();
}
loadImagesFromCloud();

/* ---------- БАЗА РЕЦЕПТОВ (40 ШТУК) ---------- */
const recipes = [
  { id: 1, title: "Паста Карбонара", img: "https://images.unsplash.com/photo-1612874742237-6526221588e3?w=800&q=80", desc: "Классическая итальянская паста", category: "Основное", time: "25 мин", servings: "2", difficulty: "Средне", calories: 380, weight: "450 г", protein: 18, fat: 22, carbs: 45,
    ingredients: ["Спагетти — 200 г","Бекон или гуанчиале — 150 г","Яичные желтки — 3 шт","Яйцо целое — 1 шт","Пармезан — 50 г","Чёрный перец — 1/2 ч. л.","Соль для воды — 1 ст. л.","Вода — 2 л"],
    equipment: ["Глубокая кастрюля (3 л)","Сковорода","Венчик","Мелкая тёрка","Миска","Щипцы или ложка-спагетти","Дуршлаг","Разделочная доска и нож"],
    steps: ["Доведите 2 л воды до кипения в кастрюле, посолите (1 ст. л. соли на 2 л воды).","Нарежьте бекон брусочками 1×0,5 см. Натрите пармезан на мелкой тёрке.","В миске венчиком взбейте 3 желтка и 1 целое яйцо с пармезаном и чёрным перцем до густой пасты.","Выложите бекон на холодную сковороду без масла, включите средний огонь и топите 6–8 минут до золотистой корочки. Снимите с огня.","Отварите спагетти на 1 минуту меньше, чем указано на упаковке (обычно 8–9 минут). Перед сливом отлейте 100 мл воды из-под пасты.","Переложите пасту щипцами на сковороду с беконом и перемешайте, огонь выключен.","Влейте яичную смесь и 2–3 ст. л. воды от пасты, быстро перемешивайте 30–40 секунд: соус должен стать глянцевым и кремовым, а яйца не свернуться.","Сразу подавайте на подогретых тарелках, посыпав пармезаном и свежемолотым перцем."] },
  { id: 2, title: "Греческий салат", img: "img/greek.jpg", desc: "Свежий салат с фетой", category: "Салаты", time: "15 мин", servings: "3", difficulty: "Легко", calories: 120, weight: "600 г", protein: 5, fat: 9, carbs: 6,
    ingredients: ["Помидоры — 3 средних (350 г)","Огурцы — 2 шт (250 г)","Сладкий перец — 1 шт","Красный лук — 1/2 шт","Фета — 150 г","Маслины без косточек — 10–12 шт","Оливковое масло — 3 ст. л.","Сушёный орегано — 1 ч. л.","Соль — по вкусу"],
    equipment: ["Разделочная доска","Острый нож","Большой салатник","Ложка для перемешивания","Дуршлаг (для маслин)"],
    steps: ["Вымойте овощи и обсушите бумажным полотенцем.","Помидоры нарежьте крупными дольками, огурцы — полукольцами толщиной 1 см, перец — кольцами или полосками.","Красный лук нарежьте тонкими полукольцами; если он острый, залейте на 5 минут холодной водой и обсушите.","Сложите овощи и лук в салатник, добавьте маслины, слегка посолите.","Полейте оливковым маслом и осторожно перемешайте 2–3 раза.","Сверху выложите фету целым куском или крупными кубиками 2×2 см, посыпьте орегано.","Подавайте сразу, пока овощи хрустят."] },
  { id: 3, title: "Борщ", img: "img/borsh.jpg", desc: "Украинский суп", category: "Супы", time: "90 мин", servings: "6", difficulty: "Средне", calories: 85, weight: "2.5 кг", protein: 6, fat: 4, carbs: 8,
    ingredients: ["Говядина на кости — 500 г","Вода — 2,5 л","Свёкла — 2 средние (300 г)","Капуста белокочанная — 300 г","Картофель — 3 шт (350 г)","Морковь — 1 шт","Лук репчатый — 1 шт","Томатная паста — 2 ст. л.","Чеснок — 3 зубчика","Растительное масло — 3 ст. л.","Уксус 9% — 1 ст. л.","Лавровый лист — 2 шт","Сметана и зелень — для подачи"],
    equipment: ["Кастрюля 4 л","Сковорода с высокими бортами","Крупная тёрка","Разделочная доска и нож","Шумовка","Половник","Лопатка"],
    steps: ["Мясо промойте, залейте холодной водой, доведите до кипения и снимите пену шумовкой. Варите на слабом огне 1–1,5 часа до мягкости, посолив за 20 минут до конца.","Свёклу и морковь натрите на крупной тёрке, лук нарежьте мелкими кубиками.","На сковороде разогрейте 2 ст. л. масла, обжарьте лук 3 минуты, добавьте морковь и жарьте ещё 3 минуты.","В отдельной сковороде с 1 ст. л. масла тушите свёклу 10 минут, влив уксус и 3 ст. л. бульона — так сохранится яркий цвет. Добавьте томатную пасту и тушите ещё 5 минут.","Достаньте мясо, разберите на куски. Картофель нарежьте брусочками, капусту — тонкой соломкой.","В кипящий бульон положите картофель, варите 10 минут, затем добавьте капусту и варите ещё 5 минут.","Добавьте зажарку из лука с морковью и свёклу, лавровый лист, верните мясо. Варите 10 минут.","Добавьте измельчённый чеснок, выключите огонь и дайте настояться под крышкой 20 минут.","Подавайте со сметаной и рубленой зеленью."] },
  { id: 4, title: "Блины", img: "https://images.unsplash.com/photo-1567620905732-2d1ec7ab7445?w=800", desc: "Тонкие блины", category: "Завтрак", time: "30 мин", servings: "4", difficulty: "Легко", calories: 230, weight: "700 г", protein: 6, fat: 8, carbs: 35,
    ingredients: ["Мука — 200 г","Молоко — 500 мл","Яйца — 2 шт","Сахар — 2 ст. л.","Соль — 1/2 ч. л.","Растительное масло — 2 ст. л. (в тесто)","Сливочное масло — 30 г (для смазывания)"],
    equipment: ["Глубокая миска","Венчик или блендер","Блинная сковорода 22–24 см","Половник (50–60 мл)","Лопатка","Сито","Тарелка"],
    steps: ["Взбейте яйца с сахаром и солью венчиком до однородности.","Влейте половину молока (250 мл) комнатной температуры и перемешайте.","Просейте муку через сито порциями, постоянно размешивая, чтобы не было комочков.","Влейте оставшееся молоко и растительное масло, взбейте до консистенции жидких сливок.","Накройте тесто и оставьте на 15 минут — мука набухнет, блины не порвутся.","Хорошо разогрейте сковороду на среднем огне, смажьте маслом только перед первым блином.","Влейте 1 половник теста, быстро наклоняя сковороду, распределите тонким слоем.","Жарьте 1–1,5 минуты до золотистых краёв, переверните и жарьте ещё 30–40 секунд.","Складывайте стопкой, смазывая каждый блин растопленным сливочным маслом. Подавайте со сметаной, вареньем или мёдом."] },
  { id: 5, title: "Шарлотка", img: "https://images.unsplash.com/photo-1519915028121-7d3463d20b13?w=800", desc: "Яблочный пирог", category: "Десерт", time: "50 мин", servings: "6", difficulty: "Легко", calories: 260, weight: "1.2 кг", protein: 4, fat: 6, carbs: 48,
    ingredients: ["Яйца — 4 шт","Сахар — 200 г","Мука — 200 г","Яблоки кисло-сладкие — 4 шт (600 г)","Ванильный сахар — 1 ч. л.","Корица — 1 ч. л.","Сливочное масло — 10 г (для формы)","Сахарная пудра — для посыпки"],
    equipment: ["Разъёмная форма 24 см","Миксер","Миска","Нож и овощечистка","Сито","Лопатка","Духовка","Зубочистка или шпажка"],
    steps: ["Разогрейте духовку до 180 °C. Форму смажьте маслом.","Яблоки очистите, удалите сердцевину, нарежьте дольками толщиной 1 см и посыпьте корицей.","Взбивайте яйца с сахаром миксером на высокой скорости 5–7 минут, пока масса не увеличится втрое и не побелеет.","Просейте муку и ванильный сахар в яичную массу, аккуратно перемешайте лопаткой снизу вверх, не разрушая пену.","Выложите яблоки на дно формы и залейте тестом.","Выпекайте 35–40 минут на средней полке. Проверьте готовность шпажкой — она должна выйти сухой.","Не открывайте духовку первые 25 минут, иначе пирог осядет.","Остудите в форме 10 минут, выньте и посыпьте сахарной пудрой."] },
  { id: 6, title: "Куриные котлеты", img: "https://images.unsplash.com/photo-1562967914-608f82629710?w=800", desc: "Сочные котлеты", category: "Основное", time: "40 мин", servings: "4", difficulty: "Легко", calories: 220, weight: "700 г", protein: 20, fat: 14, carbs: 5,
    ingredients: ["Куриный фарш — 600 г","Лук репчатый — 1 шт","Яйцо — 1 шт","Белый хлеб без корки — 2 ломтика","Молоко — 80 мл","Чеснок — 2 зубчика","Соль — 1 ч. л.","Чёрный перец — 1/2 ч. л.","Панировочные сухари — 3 ст. л.","Растительное масло — 4 ст. л."],
    equipment: ["Большая миска","Сковорода с крышкой","Тёрка или блендер","Лопатка","Разделочная доска","Тарелка для панировки","Бумажные полотенца"],
    steps: ["Замочите хлеб в молоке на 5 минут, затем слегка отожмите.","Лук и чеснок измельчите в блендере или натрите на мелкой тёрке.","Соедините фарш, хлеб, лук, чеснок, яйцо, соль и перец. Вымешивайте 3–4 минуты, пока фарш не станет вязким.","Охладите фарш в холодильнике 10 минут.","Смочите руки водой, формуйте овальные котлеты по 80–90 г, обваляйте в сухарях.","Разогрейте масло на сковороде на среднем огне. Обжаривайте котлеты по 3–4 минуты с каждой стороны до румяной корочки.","Убавьте огонь до минимума, накройте крышкой и доведите до готовности 8–10 минут.","Выложите на бумажные полотенца на минуту, чтобы убрать лишний жир, и подавайте."] },
  { id: 7, title: "Овсяная каша", img: "img/ovsyanka.jpg", desc: "Полезный завтрак", category: "Завтрак", time: "10 мин", servings: "1", difficulty: "Легко", calories: 150, weight: "300 г", protein: 6, fat: 4, carbs: 24,
    ingredients: ["Овсяные хлопья — 50 г","Молоко — 200 мл","Вода — 100 мл","Мёд — 1 ст. л.","Сливочное масло — 5 г","Соль — щепотка","Ягоды или орехи — для подачи"],
    equipment: ["Маленький ковшик","Деревянная ложка","Мерный стакан","Глубокая тарелка"],
    steps: ["Влейте молоко и воду в ковшик, добавьте щепотку соли и доведите до кипения.","Всыпьте овсяные хлопья, перемешайте и убавьте огонь до слабого.","Варите 5–7 минут, помешивая, пока каша не загустеет.","Снимите с огня, добавьте масло, накройте крышкой и оставьте на 2 минуты.","Переложите в тарелку, полейте мёдом, добавьте ягоды или орехи."] },
  { id: 8, title: "Пицца", img: "https://images.unsplash.com/photo-1574071318508-1cdbab80d002?w=800", desc: "Домашняя пицца", category: "Основное", time: "60 мин", servings: "2", difficulty: "Средне", calories: 270, weight: "600 г", protein: 12, fat: 10, carbs: 35,
    ingredients: ["Мука — 250 г","Вода тёплая — 150 мл","Сухие дрожжи — 1/2 ч. л.","Оливковое масло — 1 ст. л.","Соль — 1/2 ч. л.","Томатный соус — 4 ст. л.","Моцарелла — 150 г","Базилик — несколько листьев","Колбаса или грибы — по желанию"],
    equipment: ["Миска","Скалка","Противень или камень для пиццы","Пергамент","Духовка","Нож для пиццы","Ложка"],
    steps: ["Смешайте муку, дрожжи и соль. Влейте воду и масло, замесите тесто 8–10 минут до гладкости.","Накройте полотенцем и оставьте в тёплом месте на 40 минут — тесто должно удвоиться.","Разогрейте духовку до максимума (250 °C) вместе с противнем.","Раскатайте тесто в круг диаметром 28–30 см на пергаменте, края сделайте чуть толще.","Смажьте тесто томатным соусом, оставив 1 см по краю.","Выложите нарезанную или натёртую моцареллу и добавки.","Переместите пиццу вместе с пергаментом на горячий противень и выпекайте 8–10 минут до золотистых краёв и пузырящегося сыра.","Посыпьте базиликом, нарежьте на 6–8 секторов."] },
  { id: 9, title: "Сырный суп", img: "https://images.pexels.com/photos/37593663/pexels-photo-37593663.jpeg?w=800", desc: "Крем-суп с сыром", category: "Супы", time: "35 мин", servings: "4", difficulty: "Легко", calories: 130, weight: "1.5 кг", protein: 8, fat: 9, carbs: 5,
    ingredients: ["Куриный бульон — 1 л","Плавленый сыр — 200 г","Картофель — 3 шт (300 г)","Морковь — 1 шт","Лук — 1 шт","Сливочное масло — 20 г","Соль, перец — по вкусу","Сухарики или зелень — для подачи"],
    equipment: ["Кастрюля 2–3 л","Погружной блендер","Разделочная доска и нож","Деревянная ложка","Половник"],
    steps: ["Картофель и морковь очистите и нарежьте кубиками 1,5 см, лук мелко порубите.","Растопите масло в кастрюле, обжарьте лук 3 минуты до прозрачности.","Влейте бульон, добавьте картофель и морковь, варите 15–20 минут до мягкости.","Измельчите плавленый сыр, снимите кастрюлю с сильного огня.","Взбейте суп погружным блендером до гладкости.","Верните на слабый огонь, добавьте сыр и помешивайте 3–4 минуты, пока он полностью не растворится. Не доводите до кипения.","Посолите, поперчите, подавайте с сухариками или зеленью."] },
  { id: 10, title: "Цезарь", img: "https://images.unsplash.com/photo-1550304943-4f24f54ddde9?w=800", desc: "С курицей и сухариками", category: "Салаты", time: "30 мин", servings: "2", difficulty: "Средне", calories: 180, weight: "400 г", protein: 15, fat: 12, carbs: 8,
    ingredients: ["Куриное филе — 250 г","Салат романо или айсберг — 150 г","Пармезан — 40 г","Белый хлеб — 3 ломтика","Чеснок — 2 зубчика","Оливковое масло — 3 ст. л.","Яичный желток — 1 шт","Горчица дижонская — 1 ч. л.","Лимонный сок — 1 ст. л.","Анчоусы — 2 шт (по желанию)","Соль, перец — по вкусу"],
    equipment: ["Сковорода","Противень","Миска для соуса","Венчик","Тёрка","Разделочная доска и нож","Духовка","Салатник"],
    steps: ["Нагрейте духовку до 180 °C. Хлеб нарежьте кубиками 1,5 см, смешайте с 1 ст. л. масла и 1 зубчиком чеснока.","Выложите хлеб на противень и подсушите 8–10 минут до золотистого цвета.","Филе посолите, поперчите и обжарьте на сковороде с 1 ст. л. масла по 5–6 минут с каждой стороны. Дайте отдохнуть 5 минут и нарежьте ломтиками.","Для соуса разотрите оставшийся чеснок с анчоусами, смешайте с желтком, горчицей и лимонным соком, тонкой струйкой вливая оставшееся масло и взбивая.","Листья салата порвите руками, переложите в салатник и заправьте соусом.","Сверху выложите курицу и сухарики, натрите пармезан и подавайте сразу."] },
  { id: 11, title: "Грибной суп", img: "https://images.pexels.com/photos/2548840/pexels-photo-2548840.jpeg?w=800", desc: "Из шампиньонов", category: "Супы", time: "40 мин", servings: "4", difficulty: "Средне", calories: 140, weight: "1.4 кг", protein: 5, fat: 11, carbs: 7,
    ingredients: ["Шампиньоны — 400 г","Лук — 1 шт","Картофель — 2 шт","Сливки 20% — 200 мл","Овощной или куриный бульон — 800 мл","Сливочное масло — 30 г","Чеснок — 2 зубчика","Соль, перец, тимьян — по вкусу"],
    equipment: ["Кастрюля 2–3 л","Сковорода","Погружной блендер","Разделочная доска и нож","Деревянная лопатка","Половник"],
    steps: ["Грибы очистите и нарежьте тонкими пластинками, лук и чеснок мелко порубите, картофель нарежьте кубиками.","Растопите масло на сковороде и обжарьте грибы на сильном огне 7–8 минут до испарения влаги и золотистой корочки.","В кастрюле обжарьте лук 3 минуты, добавьте чеснок и тимьян на 30 секунд.","Всыпьте картофель, залейте бульоном, варите 15 минут до мягкости.","Добавьте две трети грибов и взбейте суп блендером до однородности.","Влейте сливки, прогрейте 3–4 минуты без кипения, посолите и поперчите.","Подавайте с оставшимися обжаренными грибами сверху."] },
  { id: 12, title: "Тирамису", img: "https://images.unsplash.com/photo-1571877227200-a0d98ea607e9?w=800", desc: "Итальянский десерт", category: "Десерт", time: "30 мин", servings: "6", difficulty: "Средне", calories: 320, weight: "900 г", protein: 6, fat: 20, carbs: 30,
    ingredients: ["Маскарпоне — 500 г","Яичные желтки — 4 шт","Сахар — 100 г","Печенье савоярди — 250 г","Крепкий эспрессо — 250 мл","Амаретто или ром — 2 ст. л. (по желанию)","Какао-порошок — 2 ст. л."],
    equipment: ["Миксер","Две миски","Прямоугольная форма 20×25 см","Широкая тарелка для кофе","Лопатка","Сито","Плёнка"],
    steps: ["Сварите эспрессо, остудите до комнатной температуры, при желании добавьте амаретто.","Взбейте желтки с сахаром миксером 5 минут до светлой густой массы.","Добавьте маскарпоне и аккуратно перемешайте лопаткой до гладкого крема.","Быстро окуните каждое печенье в кофе на 1–2 секунды с каждой стороны и плотно выложите слоем на дно формы.","Нанесите половину крема и разровняйте.","Повторите со вторым слоем печенья и оставшимся кремом.","Накройте плёнкой и уберите в холодильник минимум на 4 часа, лучше на ночь.","Перед подачей посыпьте какао через сито."] },
  { id: 13, title: "Сырники", img: "img/syrniki.jpg", desc: "Творожные сырники", category: "Завтрак", time: "25 мин", servings: "3", difficulty: "Легко", calories: 210, weight: "500 г", protein: 16, fat: 8, carbs: 22,
    ingredients: ["Творог 5–9% — 400 г","Яйцо — 1 шт","Мука — 4 ст. л. (+ 3 ст. л. для обваливания)","Сахар — 2 ст. л.","Ванильный сахар — 1 ч. л.","Соль — щепотка","Растительное масло — 3 ст. л.","Сметана или варенье — для подачи"],
    equipment: ["Миска","Вилка или картофелемялка","Сковорода","Лопатка","Тарелка для муки","Бумажные полотенца"],
    steps: ["Если творог влажный, отожмите его через марлю или оставьте в сите на 15 минут.","Разомните творог вилкой до однородности, добавьте яйцо, сахар, ванильный сахар и соль.","Всыпьте 4 ст. л. муки и замесите мягкое, но не липнущее тесто.","Смочите руки, скатайте шарики по 50 г, придайте форму лепёшек толщиной 1,5 см и обваляйте в муке.","Разогрейте масло на сковороде на среднем огне.","Жарьте сырники по 3 минуты с каждой стороны до золотистой корочки.","Уберите огонь до минимума, накройте крышкой на 2 минуты, чтобы они пропеклись внутри.","Подавайте со сметаной, вареньем или свежими ягодами."] },
  { id: 14, title: "Оливье", img: "https://images.pexels.com/photos/35572936/pexels-photo-35572936.jpeg?w=800", desc: "Праздничный салат", category: "Салаты", time: "40 мин", servings: "6", difficulty: "Легко", calories: 190, weight: "1.3 кг", protein: 6, fat: 15, carbs: 10,
    ingredients: ["Картофель — 4 шт (400 г)","Морковь — 2 шт","Яйца — 4 шт","Варёная колбаса — 300 г","Солёные огурцы — 4 шт","Зелёный горошек — 1 банка (200 г)","Майонез — 150 г","Соль, перец — по вкусу","Зелень укропа — пучок"],
    equipment: ["Кастрюля","Большой салатник","Разделочная доска и острый нож","Дуршлаг","Ложка","Нож для чистки овощей"],
    steps: ["Картофель и морковь тщательно вымойте и отварите в кожуре 20–25 минут до готовности, яйца отварите 10 минут.","Овощи и яйца остудите и очистите (лучше оставить на 30 минут в холодильнике).","Нарежьте картофель, морковь, яйца, колбасу и огурцы одинаковыми кубиками 0,7–1 см.","Горошек слейте от жидкости на дуршлаге.","Соедините все в салатнике, добавьте горошек и рубленый укроп.","Посолите, поперчите, заправьте майонезом и аккуратно перемешайте.","Охладите в холодильнике 1 час перед подачей."] },
  { id: 15, title: "Плов", img: "https://images.pexels.com/photos/14286683/pexels-photo-14286683.jpeg?w=800", desc: "С бараниной", category: "Основное", time: "1.5 ч", servings: "6", difficulty: "Сложно", calories: 300, weight: "2 кг", protein: 12, fat: 10, carbs: 35,
    ingredients: ["Баранина — 700 г","Рис длиннозёрный (девзира или пропаренный) — 500 г","Морковь — 600 г","Лук репчатый — 3 шт","Растительное масло — 150 мл","Чеснок — 1 головка","Зира — 2 ч. л.","Барбарис — 1 ст. л.","Соль — 2 ч. л.","Вода кипящая — около 700 мл"],
    equipment: ["Казан или чугунная кастрюля","Шумовка","Острый нож","Разделочная доска","Миска для замачивания риса","Деревянная лопатка","Половник","Плоское блюдо"],
    steps: ["Промойте рис 5–6 раз до прозрачной воды и залейте тёплой солёной водой на 30–40 минут.","Баранину нарежьте кусками 3–4 см, лук — полукольцами, морковь — соломкой толщиной 0,5 см.","Разогрейте масло в казане до лёгкого дымка. Обжарьте мясо 8–10 минут до румяной корочки.","Добавьте лук и жарьте 5–7 минут до золотистого цвета.","Добавьте морковь и обжаривайте ещё 7–10 минут, затем влейте 300 мл кипятка, добавьте соль, зиру, барбарис — получится зирвак. Тушите на слабом огне 30 минут.","Слейте воду с риса и ровным слоем выложите его поверх зирвака, не перемешивая. Добавьте кипяток так, чтобы он покрывал рис на 1,5 см.","Воткните в центр головку чеснока. Варите на сильном огне без крышки до испарения воды.","Соберите рис горкой, накройте крышкой, убавьте огонь до минимума и томите 20 минут.","Перед подачей аккуратно перемешайте, выложите на блюдо, сверху положите мясо и чеснок."] },
  { id: 16, title: "Стейк", img: "https://images.unsplash.com/photo-1546964124-0cce460f38ef?w=800", desc: "Рибай с розмарином", category: "Основное", time: "20 мин", servings: "1", difficulty: "Средне", calories: 350, weight: "300 г", protein: 25, fat: 22, carbs: 0,
    ingredients: ["Стейк рибай толщиной 3–4 см — 300 г","Сливочное масло — 30 г","Чеснок — 3 зубчика","Розмарин — 2 веточки","Оливковое масло — 1 ст. л.","Крупная морская соль — 1 ч. л.","Чёрный перец — по вкусу"],
    equipment: ["Чугунная сковорода","Щипцы","Пищевой термометр","Ложка для поливания","Бумажные полотенца","Разделочная доска","Фольга"],
    steps: ["Достаньте мясо из холодильника за 30–40 минут до жарки. Тщательно обсушите бумажными полотенцами.","Посолите и поперчите стейк со всех сторон.","Раскалите сковороду на сильном огне 3–5 минут до лёгкого дыма, добавьте оливковое масло.","Выложите стейк и жарьте 2–3 минуты без перемешивания до тёмной корочки, затем переверните.","Добавьте масло, раздавленный чеснок и розмарин, жарьте ещё 2–3 минуты, поливая стейк растопленным маслом.","Для прожарки medium доведите температуру внутри до 55–57 °C (для rare — 50 °C, для well done — 70 °C).","Переложите на доску, накройте фольгой и дайте отдохнуть 5 минут — соки распределятся.","Нарежьте поперёк волокон и подавайте с маслом со сковороды."] },
  { id: 17, title: "Брускетта", img: "https://images.unsplash.com/photo-1572695157366-5e585ab2b69f?w=800", desc: "С томатами", category: "Закуски", time: "15 мин", servings: "4", difficulty: "Легко", calories: 160, weight: "350 г", protein: 5, fat: 6, carbs: 20,
    ingredients: ["Багет или чиабатта — 8 ломтиков","Помидоры спелые — 4 шт (400 г)","Чеснок — 2 зубчика","Оливковое масло — 3 ст. л.","Свежий базилик — 8 листьев","Бальзамический уксус — 1 ч. л.","Соль, перец — по вкусу"],
    equipment: ["Разделочная доска и нож","Тостер, гриль или сковорода-гриль","Миска","Ложка"],
    steps: ["Нарежьте хлеб ломтиками толщиной 1,5 см и сбрызните оливковым маслом.","Подсушите ломтики на гриле или сковороде по 1–2 минуты с каждой стороны до золотистого цвета.","Натрите горячие ломтики разрезанным зубчиком чеснока.","Помидоры нарежьте мелкими кубиками, удалив лишний сок, смешайте с маслом, бальзамическим уксусом, солью и перцем.","Выложите томатную смесь на хлеб.","Украсьте листьями базилика и подавайте сразу, чтобы хлеб оставался хрустящим."] },
  { id: 18, title: "Ризотто", img: "https://images.unsplash.com/photo-1476124369491-e7addf5db371?w=800", desc: "С грибами", category: "Основное", time: "35 мин", servings: "3", difficulty: "Средне", calories: 250, weight: "900 г", protein: 8, fat: 9, carbs: 28,
    ingredients: ["Рис арборио — 250 г","Шампиньоны — 300 г","Лук-шалот или репчатый — 1 шт","Куриный или овощной бульон горячий — 900 мл","Белое сухое вино — 100 мл","Сливочное масло — 40 г","Оливковое масло — 2 ст. л.","Пармезан — 50 г","Чеснок — 2 зубчика","Соль, перец — по вкусу"],
    equipment: ["Сковорода с высокими бортами или сотейник","Маленькая кастрюля для бульона","Деревянная лопатка","Половник","Тёрка","Разделочная доска и нож"],
    steps: ["Подогрейте бульон в отдельной кастрюле и держите на минимальном огне.","Грибы нарежьте пластинами, лук и чеснок мелко порубите.","Обжарьте грибы на оливковом масле 6–7 минут до золотистого цвета, переложите в тарелку.","В той же сковороде растопите 20 г масла, обжарьте лук 3 минуты, добавьте чеснок на 30 секунд.","Всыпьте рис и обжаривайте 2 минуты, пока зёрна не станут прозрачными по краям.","Влейте вино и выпарите почти полностью.","Добавляйте бульон по половнику, помешивая и дожидаясь впитывания перед каждой порцией. Так готовьте 18–20 минут.","В конце верните грибы, добавьте оставшееся масло и тёртый пармезан, перемешайте, накройте крышкой на 2 минуты.","Рис должен быть al dente, консистенция — текучая, «волной». Подавайте сразу."] },
  { id: 19, title: "Брауни", img: "https://images.unsplash.com/photo-1606313564200-e75d5e30476c?w=800", desc: "Шоколадный", category: "Десерт", time: "45 мин", servings: "8", difficulty: "Легко", calories: 400, weight: "800 г", protein: 5, fat: 22, carbs: 40,
    ingredients: ["Тёмный шоколад 70% — 200 г","Сливочное масло — 150 г","Сахар — 180 г","Яйца — 3 шт","Мука — 90 г","Какао-порошок — 2 ст. л.","Соль — щепотка","Грецкие орехи — 80 г (по желанию)"],
    equipment: ["Форма 20×20 см","Пергамент","Кастрюля и миска для водяной бани","Венчик","Лопатка","Сито","Духовка","Шпажка"],
    steps: ["Разогрейте духовку до 175 °C, выстелите форму пергаментом.","Растопите шоколад с маслом на водяной бане, помешивая, и немного остудите.","Взбейте яйца с сахаром и солью венчиком 2 минуты.","Влейте шоколадную массу и перемешайте до гладкости.","Просейте муку и какао, аккуратно вмешайте лопаткой, добавьте рубленые орехи.","Вылейте тесто в форму, разровняйте.","Выпекайте 22–25 минут: края должны схватиться, а середина остаться чуть влажной. Шпажка выходит с влажными крошками.","Полностью остудите в форме (минимум 1 час), затем нарежьте квадратами."] },
  { id: 20, title: "Лимонад", img: "https://images.unsplash.com/photo-1621263764928-df1444c5e859?w=800", desc: "С мятой", category: "Напитки", time: "10 мин", servings: "4", difficulty: "Легко", calories: 45, weight: "1.2 л", protein: 0, fat: 0, carbs: 11,
    ingredients: ["Лимоны — 4 шт (около 200 мл сока)","Сахар — 100 г","Вода холодная — 800 мл","Мята — 1 пучок","Лёд — 200 г","Газированная вода — по желанию"],
    equipment: ["Соковыжималка для цитрусовых","Кувшин 1,5 л","Ступка или ложка для разминания мяты","Нож и доска","Ложка","Сито"],
    steps: ["Лимоны хорошо вымойте и прокатите по столу, чтобы они дали больше сока.","Выжмите сок из лимонов и процедите через сито.","Половину мяты разомните ступкой с сахаром, чтобы выделилось эфирное масло.","Добавьте сок и холодную воду в кувшин, размешайте до растворения сахара.","Добавьте оставшиеся листья мяты и лёд.","Охладите 10 минут и подавайте в высоких стаканах, при желании добавив газированную воду."] },
  { id: 21, title: "Окрошка", img: "https://images.pexels.com/photos/5638247/pexels-photo-5638247.jpeg?w=800", desc: "Холодный суп", category: "Супы", time: "30 мин", servings: "4", difficulty: "Легко", calories: 60, weight: "1.5 кг", protein: 4, fat: 3, carbs: 5,
    ingredients: ["Квас хлебный — 1,2 л","Картофель — 3 шт","Яйца — 3 шт","Докторская колбаса — 250 г","Свежие огурцы — 3 шт","Редис — 6 шт","Зелёный лук и укроп — по пучку","Сметана — 4 ст. л.","Горчица — 1 ч. л.","Соль — по вкусу"],
    equipment: ["Кастрюля","Разделочная доска и нож","Большая кастрюля или миска","Половник","Ложка"],
    steps: ["Отварите картофель в кожуре (20 минут) и яйца вкрутую (10 минут), остудите и очистите.","Нарежьте картофель, яйца, колбасу, огурцы и редис мелкими кубиками 0,7 см.","Зелень мелко порубите, посыпьте солью и разомните ложкой, чтобы пустила сок.","Соедините все ингредиенты в большой кастрюле.","Добавьте горчицу и перемешайте.","Залейте холодным квасом, посолите по вкусу и перемешайте.","Подавайте охлаждённой, добавив в тарелку ложку сметаны."] },
  { id: 22, title: "Бефстроганов", img: "https://images.unsplash.com/photo-1534080564583-6be75777b70a?w=800", desc: "В сливочном соусе", category: "Основное", time: "40 мин", servings: "4", difficulty: "Средне", calories: 220, weight: "800 г", protein: 18, fat: 14, carbs: 6,
    ingredients: ["Говяжья вырезка — 500 г","Шампиньоны — 250 г","Лук репчатый — 2 шт","Сливки 20% — 200 мл","Сметана — 3 ст. л.","Мука — 1 ст. л.","Горчица — 1 ч. л.","Растительное масло — 3 ст. л.","Соль, перец — по вкусу","Петрушка — для подачи"],
    equipment: ["Сковорода с высокими бортами","Разделочная доска","Острый нож","Деревянная лопатка","Миска"],
    steps: ["Мясо нарежьте поперёк волокон полосками толщиной 1 см и длиной 4–5 см.","Грибы нарежьте пластинами, лук — тонкими полукольцами.","Разогрейте 2 ст. л. масла на сильном огне, обжарьте мясо порциями по 2–3 минуты до корочки, переложите в миску.","В той же сковороде добавьте остаток масла и обжарьте лук 3 минуты, затем грибы ещё 6 минут.","Всыпьте муку, перемешайте 1 минуту.","Влейте сливки, добавьте горчицу и сметану, перемешайте и прогрейте 3 минуты.","Верните мясо с соком, посолите, поперчите и тушите на слабом огне 8–10 минут.","Посыпьте петрушкой и подавайте с картофельным пюре или пастой."] },
  { id: 23, title: "Капрезе", img: "https://images.unsplash.com/photo-1592417817098-8fd3d9eb14a5?w=800", desc: "С моцареллой", category: "Закуски", time: "10 мин", servings: "2", difficulty: "Легко", calories: 180, weight: "300 г", protein: 10, fat: 12, carbs: 4,
    ingredients: ["Помидоры спелые — 3 шт (300 г)","Моцарелла — 125 г","Свежий базилик — 10 листьев","Оливковое масло extra virgin — 2 ст. л.","Бальзамический крем — 1 ч. л.","Морская соль — щепотка","Чёрный перец — по вкусу"],
    equipment: ["Разделочная доска","Острый нож","Плоская тарелка","Ложка"],
    steps: ["Помидоры и моцареллу достаньте из холодильника за 15 минут: так вкус раскрывается лучше.","Нарежьте помидоры и моцареллу кружками толщиной 0,7 см.","Выкладывайте на тарелку, чередуя помидор, сыр и лист базилика внахлёст.","Посолите, поперчите, полейте оливковым маслом и бальзамическим кремом.","Подавайте сразу."] },
  { id: 24, title: "Пюре", img: "https://images.unsplash.com/photo-1600628421066-f6bda6a7b976?w=800", desc: "Картофельное", category: "Основное", time: "30 мин", servings: "4", difficulty: "Легко", calories: 130, weight: "600 г", protein: 3, fat: 6, carbs: 18,
    ingredients: ["Картофель мучнистых сортов — 800 г","Молоко горячее — 150 мл","Сливочное масло — 50 г","Соль — 1 ч. л.","Мускатный орех — щепотка"],
    equipment: ["Кастрюля","Картофелемялка","Дуршлаг","Нож для чистки","Маленький ковшик для молока"],
    steps: ["Картофель очистите и нарежьте крупными кусками одинакового размера.","Положите в кастрюлю, залейте холодной водой на 2 см выше картофеля, посолите.","Доведите до кипения и варите 15–20 минут до мягкости (вилка легко входит).","Слейте воду и оставьте картофель в кастрюле на 1–2 минуты, чтобы испарилась влага.","Разомните картофелемялкой, добавьте масло и половину горячего молока.","Вливайте остальное молоко постепенно, помешивая до воздушной консистенции.","Добавьте щепотку мускатного ореха и подавайте горячим."] },
  { id: 25, title: "Бульон", img: "https://images.pexels.com/photos/539451/pexels-photo-539451.jpeg?w=800", desc: "Куриный", category: "Супы", time: "1.5 ч", servings: "4", difficulty: "Легко", calories: 50, weight: "2 л", protein: 3, fat: 2, carbs: 0,
    ingredients: ["Курица (суповой набор или тушка) — 1 кг","Вода холодная — 2,5 л","Морковь — 1 шт","Лук с кожурой — 1 шт","Сельдерей — 1 стебель","Лавровый лист — 2 шт","Чёрный перец горошком — 5 шт","Соль — 1,5 ч. л.","Петрушка — пучок"],
    equipment: ["Кастрюля 4 л","Шумовка","Мелкое сито","Половник","Разделочная доска и нож"],
    steps: ["Промойте курицу, положите в кастрюлю и залейте холодной водой.","Доведите до кипения на среднем огне, снимите всю пену шумовкой.","Убавьте огонь до самого слабого: бульон должен едва «вздрагивать». Варите 20 минут.","Добавьте целую морковь, лук в кожуре, сельдерей, лавровый лист и перец.","Варите ещё 50–60 минут, не накрывая крышку плотно.","За 15 минут до конца посолите и добавьте петрушку.","Достаньте курицу и овощи, процедите бульон через мелкое сито.","Подавайте с лапшой, зеленью и яйцом или используйте как основу для других блюд."] },
  { id: 26, title: "Гречка", img: "https://images.unsplash.com/photo-1543339308-43e59d6b73a6?w=800", desc: "С грибами", category: "Основное", time: "30 мин", servings: "3", difficulty: "Легко", calories: 160, weight: "700 г", protein: 6, fat: 5, carbs: 25,
    ingredients: ["Гречневая крупа — 200 г","Вода — 400 мл","Шампиньоны — 300 г","Лук — 1 шт","Сливочное масло — 30 г","Растительное масло — 1 ст. л.","Соль — 1 ч. л.","Зелень — по вкусу"],
    equipment: ["Кастрюля с крышкой","Сковорода","Сито","Деревянная лопатка","Разделочная доска и нож"],
    steps: ["Переберите гречку, промойте в сите холодной водой.","Залейте водой, посолите (1/2 ч. л.), доведите до кипения, убавьте огонь и варите под крышкой 15 минут.","Снимите с огня, оставьте под крышкой на 10 минут, не открывая.","Грибы нарежьте пластинами, лук — кубиками.","Обжарьте лук на растительном масле 3 минуты, добавьте грибы и жарьте 8–10 минут до золотистого цвета, посолите.","Добавьте сливочное масло в готовую гречку и перемешайте вилкой.","Смешайте гречку с грибами и луком, посыпьте зеленью."] },
  { id: 27, title: "Гренки", img: "https://images.unsplash.com/photo-1573140247632-f8fd74997d5c?w=800", desc: "Чесночные", category: "Закуски", time: "15 мин", servings: "2", difficulty: "Легко", calories: 350, weight: "200 г", protein: 7, fat: 12, carbs: 45,
    ingredients: ["Чёрный или белый хлеб — 6 ломтиков (200 г)","Чеснок — 3 зубчика","Растительное масло — 3 ст. л.","Соль — щепотка","Укроп — по вкусу"],
    equipment: ["Сковорода или противень","Нож","Пресс для чеснока","Лопатка","Бумажные полотенца"],
    steps: ["Хлеб нарежьте полосками или кубиками 2 см.","Разогрейте масло на сковороде на среднем огне.","Выложите хлеб одним слоем и обжаривайте 3–4 минуты, переворачивая, до золотистого цвета (в духовке — 10 минут при 180 °C).","Чеснок пропустите через пресс и смешайте с солью.","Снимите гренки с огня, посыпьте чесночной смесью и быстро перемешайте.","Переложите на бумажное полотенце, посыпьте рубленым укропом и подавайте к супу или пиву."] },
  { id: 28, title: "Коктейль", img: "https://images.pexels.com/photos/3727250/pexels-photo-3727250.jpeg?w=800", desc: "Молочный", category: "Напитки", time: "5 мин", servings: "2", difficulty: "Легко", calories: 90, weight: "500 мл", protein: 3, fat: 4, carbs: 14,

/* --- ЛОГИКА ТЕМЫ --- */
function toggleTheme() {
  const body = document.documentElement;
  const isDark = body.getAttribute('data-theme') === 'dark';
  body.setAttribute('data-theme', isDark ? 'light' : 'dark');
  document.getElementById('themeToggle').textContent = isDark ? '🌙' : '☀️';
  localStorage.setItem('recipe_theme', isDark ? 'light' : 'dark');
}
if (localStorage.getItem('recipe_theme') === 'dark') {
  document.documentElement.setAttribute('data-theme', 'dark');
  document.getElementById('themeToggle').textContent = '☀️';
}

/* --- УВЕДОМЛЕНИЯ --- */
function showToast(message, type = 'success') {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.innerHTML = (type === 'success' ? '✅ ' : '❌ ') + message;
  container.appendChild(toast);
  setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3000);
}

/* --- СПИСОК ПОКУПОК --- */
let shoppingList = JSON.parse(localStorage.getItem('recipe_shop_list') || '[]');
function updateShopBadge() {
  const badge = document.getElementById('shopBadge');
  if (shoppingList.length > 0) { badge.style.display = 'flex'; badge.textContent = shoppingList.length; } else { badge.style.display = 'none'; }
}
updateShopBadge();

function addToShoppingList(ingredient, recipeTitle) {
  const itemText = `${ingredient} (${recipeTitle})`;
  if (!shoppingList.includes(itemText)) {
    shoppingList.push(itemText); localStorage.setItem('recipe_shop_list', JSON.stringify(shoppingList));
    updateShopBadge(); showToast("Добавлено в список покупок");
  } else { showToast("Уже в списке!", "error"); }
}
function openShoppingList() {
  const modal = document.getElementById('shopModal');
  const list = document.getElementById('shopList');
  if (shoppingList.length === 0) { list.innerHTML = '<div style="text-align:center; color:var(--muted); padding:20px;">Список пуст 🍽️</div>'; }
  else {
    list.innerHTML = shoppingList.map((item, i) => `<li class="ingr-item"><span>${item}</span><button class="add-to-cart" style="background:#ffe3e3; color:#d63031;" onclick="removeFromShop(${i})">✕</button></li>`).join('');
  }
  modal.classList.add('open');
}
function removeFromShop(index) {
  shoppingList.splice(index, 1); localStorage.setItem('recipe_shop_list', JSON.stringify(shoppingList));
  updateShopBadge(); openShoppingList();
}
function clearShoppingList() {
  shoppingList = []; localStorage.setItem('recipe_shop_list', JSON.stringify(shoppingList));
  updateShopBadge(); openShoppingList();
}

/* --- РЕЖИМ ГОТОВКИ --- */
let cookSteps = [], currentStepIndex = 0;
function startCooking() {
  const r = recipes.find(x => x.id === currentModalId); if (!r) return;
  cookSteps = r.steps; currentStepIndex = 0;
  document.getElementById('cookTitle').textContent = r.title;
  closeModal(); updateCookingUI();
  document.getElementById('cooking-mode').style.display = 'flex';
}
function updateCookingUI() {
  document.getElementById('cookText').textContent = cookSteps[currentStepIndex];
  document.getElementById('cookProgress').textContent = `Шаг ${currentStepIndex + 1} из ${cookSteps.length}`;
}
function nextStep() { if (currentStepIndex < cookSteps.length - 1) { currentStepIndex++; updateCookingUI(); } else { closeCooking(); showToast("Приятного аппетита! 🍽️"); } }
function prevStep() { if (currentStepIndex > 0) { currentStepIndex--; updateCookingUI(); } }
function closeCooking() { document.getElementById('cooking-mode').style.display = 'none'; }

/* --- ИЗБРАННОЕ --- */
let favorites = JSON.parse(localStorage.getItem("recipe_favorites") || "[]");
function isFav(id) { return favorites.includes(id); }
function toggleFav(id) {
  if (isFav(id)) favorites = favorites.filter(x => x !== id); else favorites.push(id);
  localStorage.setItem("recipe_favorites", JSON.stringify(favorites));
  renderGrid();
  const mBtn = document.getElementById("mFavBtn");
  if (mBtn && mBtn.dataset.id == id) mBtn.textContent = isFav(id) ? "❤️" : "🤍";
}
function toggleFavFromModal() { if (currentModalId) toggleFav(currentModalId); }

/* --- ФИЛЬТРЫ И РЕНДЕР --- */
let currentFilter = "Все", searchQuery = "", ingredientQuery = "";
const grid = document.getElementById("grid");
const categories = ["Все", ...new Set(recipes.map(r => r.category))];

function renderFilters() {
  const allBtns = categories.map(cat => `<button class="filter-btn ${cat === currentFilter ? "active" : ""}" data-cat="${cat}">${cat}</button>`).join("");
  const favBtn = `<button class="filter-btn ${currentFilter === "Избранное" ? "active" : ""}" data-cat="Избранное">❤️ Избранное</button>`;
  document.getElementById("filters").innerHTML = allBtns + favBtn;
  document.querySelectorAll(".filter-btn").forEach(btn => { btn.onclick = () => { currentFilter = btn.dataset.cat; renderFilters(); renderGrid(); }; });
}

function renderGrid() {
  let filtered = recipes.filter(r => {
    let matchCat = currentFilter === "Все" ? true : currentFilter === "Избранное" ? isFav(r.id) : r.category === currentFilter;
    if (!matchCat) return false;
    const q = searchQuery.toLowerCase().trim();
    if (q && !r.title.toLowerCase().includes(q) && !r.desc.toLowerCase().includes(q)) return false;
    return true;
  });

  if (ingredientQuery.trim() !== "") {
    const terms = ingredientQuery.toLowerCase().split(/[, ]+/).filter(t => t.length > 1);
    if (terms.length > 0) {
      filtered = filtered.map(r => {
        let match = 0; const ings = r.ingredients.join(" ").toLowerCase();
        terms.forEach(t => { if (ings.includes(t)) match++; });
        return { ...r, match };
      }).filter(r => r.match > 0).sort((a, b) => b.match - a.match);
    }
  }

  const sortMethod = document.getElementById('sortSelect').value;
  if (sortMethod === 'time') filtered.sort((a, b) => parseFloat(a.time) * (a.time.includes('ч') ? 60 : 1) - parseFloat(b.time) * (b.time.includes('ч') ? 60 : 1));
  else if (sortMethod === 'calories') filtered.sort((a, b) => a.calories - b.calories);
  else if (sortMethod === 'title') filtered.sort((a, b) => a.title.localeCompare(b.title));

  if (filtered.length === 0) {
    grid.innerHTML = `<div style="text-align:center; grid-column:1/-1; padding:40px; font-size:20px; color:var(--muted);">Ничего не найдено 🍽️</div>`;
    return;
  }

  grid.innerHTML = filtered.map(r => {
    const displayImg = customImages[r.id] || r.img;
    return `
    <div class="card" onclick="openModal(${r.id})">
      <div class="card-image">
        <img src="${displayImg}" loading="lazy" onerror="this.src='https://via.placeholder.com/400x200?text=No+Image'">
        <button class="fav-btn ${isFav(r.id) ? "active" : ""}" onclick="event.stopPropagation();toggleFav(${r.id})">${isFav(r.id) ? "❤️" : "🤍"}</button>
      </div>
      <div class="card-body">
        <div class="badge-row">
          <span class="badge">${r.category}</span>
          <span class="badge cal">🔥 ${r.calories} ккал</span>
        </div>
        <div class="card-title">${r.title}</div>
        <div class="card-desc">${r.desc}</div>
        <div class="macros-row">
          <span>Б: ${r.protein || 0}</span><span>Ж: ${r.fat || 0}</span><span>У: ${r.carbs || 0}</span>
        </div>
      </div>
    </div>`;
  }).join("");
}

/* --- МОДАЛЬНОЕ ОКНО --- */
function openModal(id) {
  const r = recipes.find(x => x.id === id); if (!r) return;
  currentModalId = id;
  const displayImg = customImages[r.id] || r.img;
  
  document.getElementById("mImg").src = displayImg;
  document.getElementById("mTitle").textContent = r.title;
  document.getElementById("mDesc").textContent = r.desc;
  document.getElementById("mTime").textContent = r.time;
  document.getElementById("mWeight").textContent = r.weight;
  document.getElementById("mDiff").textContent = r.difficulty;
  document.getElementById("mCal").textContent = r.calories;
  document.getElementById("mServings").textContent = r.servings ? `(порций: ${r.servings})` : "";
  
  document.getElementById("mIngr").innerHTML = r.ingredients.map(i => `<li class="ingr-item"><span>${i}</span><button class="add-to-cart" onclick="addToShoppingList('${i.replace(/'/g, "\\'")}', '${r.title}')">+</button></li>`).join("");
  document.getElementById("mEquip").innerHTML = (r.equipment || []).map(e => `<li class="equip-item">🔹 ${e}</li>`).join("");
  document.getElementById("mSteps").innerHTML = r.steps.map(s => `<li class="step-item">${s}</li>`).join("");

  document.getElementById("uploadRow").style.display = isAdmin ? "flex" : "none";
  document.getElementById("resetImgBtn").style.display = customImages[r.id] ? "inline-block" : "none";
  document.getElementById("fileInput").value = "";

  const mBtn = document.getElementById("mFavBtn");
  mBtn.dataset.id = id; mBtn.textContent = isFav(id) ? "❤️" : "🤍";

  document.getElementById("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal() { document.getElementById("modal").classList.remove("open"); document.body.style.overflow = ""; currentModalId = null; }
document.getElementById("modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });
document.getElementById("shopModal").addEventListener("click", e => { if (e.target.id === "shopModal") e.target.classList.remove("open"); });
document.getElementById("searchInput").addEventListener("input", e => { searchQuery = e.target.value; renderGrid(); });
document.getElementById("ingredientInput").addEventListener("input", e => { ingredientQuery = e.target.value; renderGrid(); });

/* --- АДМИНКА --- */
const ADMIN_PASSWORD = "mikerecept6752";
let isAdmin = sessionStorage.getItem("recipe_isAdmin") === "true";

function toggleAdminMode() {
  if (isAdmin) { isAdmin = false; sessionStorage.setItem("recipe_isAdmin", "false"); updateAdminUI(); closeModal(); }
  else {
    const pass = prompt("Введите пароль:");
    if (pass === ADMIN_PASSWORD) { isAdmin = true; sessionStorage.setItem("recipe_isAdmin", "true"); updateAdminUI(); showToast("Доступ разрешен!"); }
    else if (pass !== null) { showToast("Неверный пароль!", "error"); }
  }
}
function updateAdminUI() {
  const btn = document.getElementById("adminBtn");
  btn.textContent = isAdmin ? "🔓" : "🔒";
  btn.classList.toggle("active", isAdmin);
  const uploadRow = document.getElementById("uploadRow");
  if (uploadRow) uploadRow.style.display = isAdmin ? "flex" : "none";
}

async function handleImageUpload(event) {
  if (!isAdmin) return showToast("Нет прав!", "error");
  const file = event.target.files[0];
  if (!file || !currentModalId) return;

  showToast("Загрузка фото...");
  const reader = new FileReader();
  reader.onload = async function(e) {
    const img = new Image();
    img.onload = async function() {
      const canvas = document.createElement('canvas');
      const MAX_WIDTH = 800;
      let scale = img.width > MAX_WIDTH ? MAX_WIDTH / img.width : 1;
      canvas.width = img.width * scale; canvas.height = img.height * scale;
      const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      
      const base64 = canvas.toDataURL('image/jpeg', 0.8);
      const response = await fetch(base64);
      const blob = await response.blob();

      const fileName = `recipe_${currentModalId}_${Date.now()}.jpg`;
      const { data: uploadData, error: uploadError } = await supabaseClient.storage.from('recipes').upload(fileName, blob);
      if (uploadError) return showToast("Ошибка загрузки: " + uploadError.message, "error");

      const { data: urlData } = supabaseClient.storage.from('recipes').getPublicUrl(fileName);
      const { error: dbError } = await supabaseClient.from('custom_images').upsert({ recipe_id: currentModalId, image_url: urlData.publicUrl }, { onConflict: 'recipe_id' });

      if (dbError) return showToast("Ошибка базы: " + dbError.message, "error");
      showToast("Фото обновлено!"); loadImagesFromCloud();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

async function resetImage() {
  if (!isAdmin || !currentModalId) return;
  if (!confirm("Вернуть стандартное фото?")) return;
  const { error } = await supabaseClient.from('custom_images').delete().eq('recipe_id', currentModalId);
  if (error) return showToast("Ошибка удаления", "error");
  showToast("Фото сброшено!"); loadImagesFromCloud();
}

// Старт
updateAdminUI();
renderFilters();
renderGrid();
</script>
