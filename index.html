async function loadImagesFromCloud() {
  const { data, error } = await supabase

}

/* ---------- ЗАГРУЗКА В ОБЛАКО (Supabase) ---------- */
async function handleImageUpload(event) {
  if (!isAdmin) return alert("У вас нет прав!");
  const file = event.target.files[0];
  if (!file || !currentModalId) return;

  document.getElementById("loading-overlay").style.display = "flex";

  // 1. Сжимаем фото (как в прошлом коде)
  const reader = new FileReader();
  reader.onload = async function(e) {
    const img = new Image();
    img.onload = async function() {
      const canvas = document.createElement('canvas');
      const MAX_WIDTH = 800;
      let scale = img.width > MAX_WIDTH ? MAX_WIDTH / img.width : 1;
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      
      const base64 = canvas.toDataURL('image/jpeg', 0.8);
      
      // Преобразуем base64 в blob для загрузки
      const response = await fetch(base64);
      const blob = await response.blob();

      // 2. Загружаем файл в Supabase Storage
      const fileName = `recipe_${currentModalId}_${Date.now()}.jpg`;
      const { data: uploadData, error: uploadError } = await supabase.storage
        .from('recipes')
        .upload(fileName, blob);

      if (uploadError) {
        document.getElementById("loading-overlay").style.display = "none";
        alert("Ошибка загрузки в хранилище: " + uploadError.message);
        return;
      }

      // 3. Получаем публичную ссылку на фото
      const { data: urlData } = supabase.storage
        .from('recipes')
        .getPublicUrl(fileName);

      const publicUrl = urlData.publicUrl;

      // 4. Сохраняем ссылку в базу данных (таблица custom_images)
      const { error: dbError } = await supabase
        .from('custom_images')
        .upsert({ 
          recipe_id: currentModalId, 
          image_url: publicUrl 
        }, { onConflict: 'recipe_id' }); // Если запись есть, обновляем её

      document.getElementById("loading-overlay").style.display = "none";

      if (dbError) {
        alert("Ошибка сохранения в базу: " + dbError.message);
        return;
      }

      alert("✅ Фото успешно обновлено в облаке!");
      // Перезагружаем фото из облака
      loadImagesFromCloud();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

async function resetImage() {
  if (!isAdmin) return;
  if (!currentModalId) return;
  
  if (!confirm("Вы уверены, что хотите удалить облачное фото и вернуть стандартное?")) return;

  document.getElementById("loading-overlay").style.display = "flex";

  // 1. Удаляем запись из базы данных
  const { error: dbError } = await supabase
    .from('custom_images')
    .delete()
    .eq('recipe_id', currentModalId);

  if (dbError) {
    document.getElementById("loading-overlay").style.display = "none";
    alert("Ошибка удаления из базы: " + dbError.message);
    return;
  }

  // 2. (Опционально) Можно удалить и сам файл из хранилища, но для простоты просто обновляем список
  document.getElementById("loading-overlay").style.display = "none";
  alert("✅ Фото сброшено!");
  loadImagesFromCloud(); // Перезагружаем данные
}
